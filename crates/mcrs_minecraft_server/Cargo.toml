[package]
name = "mcrs_minecraft_server"
description = "mcrs_minecraft_server"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_chat_server.workspace = true
mcrs_minecraft_command_engine.workspace = true
mcrs_minecraft_command_vanilla.workspace = true
