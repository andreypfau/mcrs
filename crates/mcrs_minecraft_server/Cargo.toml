# Without this a build of the server alone runs every schedule and `par_iter` on one thread.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy_ecs = { workspace = true, features = ["multi_threaded"] }
bevy_asset = { workspace = true, features = ["multi_threaded"] }

[dev-dependencies]
mcrs_minecraft_probe.workspace = true
mcrs_minecraft_item_stack = { workspace = true, features = ["bevy"] }
mcrs_minecraft_lang.workspace = true
mcrs_minecraft_text_flatten.workspace = true
