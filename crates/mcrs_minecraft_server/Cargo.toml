mcrs_minecraft_engine_server.workspace = true
mcrs_minecraft_engine_world.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_key.workspace = true
mcrs_minecraft_game_mode.workspace = true
mcrs_minecraft_goals.workspace = true
mcrs_minecraft_item.workspace = true
mcrs_minecraft_item_table = { workspace = true, features = ["bevy"] }
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_loot_table.workspace = true
mcrs_minecraft_block_support.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_physics.workspace = true
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
