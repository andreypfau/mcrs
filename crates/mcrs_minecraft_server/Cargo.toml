mcrs_minecraft_item_key.workspace = true
mcrs_minecraft_game_rule.workspace = true
mcrs_minecraft_dimension_environment = { workspace = true, features = ["bevy"] }
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_environment = { workspace = true, features = ["bevy"] }
mcrs_minecraft_chunk = { workspace = true, features = ["bevy"] }
mcrs_minecraft_heightmap = { workspace = true, features = ["bevy"] }
mcrs_minecraft_simulation.workspace = true
mcrs_minecraft_random.workspace = true
mcrs_minecraft_nbt.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
flume.workspace = true
mcrs_minecraft_light_engine = { workspace = true, features = ["bevy"] }
mcrs_minecraft_command_tree.workspace = true
mcrs_command.workspace = true
mcrs_minecraft_command_argument_vanilla.workspace = true
mcrs_minecraft_chat_client.workspace = true
mcrs_minecraft_game_registries = { workspace = true, features = ["test-support"] }
mcrs_minecraft_fixtures.workspace = true
mcrs_minecraft_worldgen_generator = { workspace = true, features = ["bevy", "test-support"] }
