mcrs_engine_store.workspace = true
mcrs_minecraft_worldgen_structure.workspace = true
mcrs_minecraft_engine_registries = { workspace = true, features = ["test-support"] }
mcrs_minecraft_engine = { workspace = true, features = ["world-access"] }
mcrs_minecraft_resource.workspace = true
mcrs_voxel.workspace = true
mcrs_minecraft_game_mode.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_datapack.workspace = true
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
mcrs_minecraft_network = { workspace = true, features = ["bevy"] }
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
