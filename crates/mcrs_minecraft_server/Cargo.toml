[package]
name = "mcrs_minecraft_server"
description = "mcrs_minecraft_server"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
mcrs_minecraft_item.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_biome.workspace = true
mcrs_minecraft_block.workspace = true
mcrs_minecraft_environment.workspace = true
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_registry = { workspace = true, features = ["bevy"] }
fixedbitset.workspace = true
mcrs_minecraft_chunk = { workspace = true, features = ["bevy"] }
mcrs_minecraft_level.workspace = true
mcrs_minecraft_light = { workspace = true, features = ["bevy"] }
mcrs_minecraft_network = { workspace = true, features = ["bevy"] }
mcrs_minecraft_protocol = { workspace = true, features = ["bevy"] }
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_world.workspace = true
mcrs_minecraft_decoration.workspace = true
mcrs_minecraft_worldgen = { workspace = true, features = ["bevy", "fast"] }
mcrs_minecraft_random.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_anvil.workspace = true
bevy_math.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_state.workspace = true
bevy_time.workspace = true
bevy_tasks.workspace = true
bevy_asset.workspace = true
bevy_reflect.workspace = true
tokio.workspace = true
rand.workspace = true
serde_json.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true
derive_more.workspace = true
bytes.workspace = true
flume.workspace = true
thiserror.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
bitflags = "2.10.0"
tracing = { workspace = true }

[dev-dependencies]
mcrs_minecraft_worldgen = { workspace = true, features = ["corpus", "test-support"] }
tracing-subscriber = "0.3"
rand_xoshiro = { workspace = true }
base64 = { workspace = true }
proptest = "1.11.0"
rand09 = { package = "rand", version = "0.9" }
criterion = { version = "0.7", features = ["html_reports"] }

[features]
telemetry-tracy = ["mcrs_minecraft_network/telemetry-tracy", "mcrs_minecraft_level/telemetry-tracy"]

[[bench]]
name = "beta_chunks"
harness = false

[[bench]]
name = "generate_columns"
harness = false

[[bench]]
name = "tr07_scale"
harness = false

[[bench]]
name = "tr07_baseline"
harness = false

[[bench]]
name = "overworld_pipeline"
harness = false

[[bench]]
name = "biome_matrix"
harness = false
