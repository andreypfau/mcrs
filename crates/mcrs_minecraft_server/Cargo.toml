[package]
name = "mcrs_minecraft_server"
description = "mcrs_minecraft_server"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
mcrs_minecraft_worldgen_generator.workspace = true
mcrs_minecraft_worldgen_feature_place.workspace = true
mcrs_minecraft_worldgen_structure.workspace = true
mcrs_minecraft_worldgen_carver.workspace = true
mcrs_minecraft_worldgen_feature.workspace = true
mcrs_minecraft_worldgen_surface.workspace = true
mcrs_minecraft_worldgen_density.workspace = true
mcrs_minecraft_item.workspace = true
mcrs_minecraft_inventory.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_biome.workspace = true
mcrs_minecraft_block.workspace = true
mcrs_minecraft_environment.workspace = true
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_registry = { workspace = true, features = ["bevy"] }
fixedbitset.workspace = true
mcrs_minecraft_chunk = { workspace = true, features = ["bevy"] }
mcrs_minecraft_level.workspace = true
mcrs_minecraft_light = { workspace = true, features = ["bevy"] }
mcrs_minecraft_network = { workspace = true, features = ["bevy"] }
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_world.workspace = true
mcrs_minecraft_worldgen = { workspace = true, features = ["fast"] }
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_anvil.workspace = true
bevy_math.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_state.workspace = true
bevy_time.workspace = true
bevy_tasks.workspace = true
bevy_asset.workspace = true
bevy_reflect.workspace = true
tokio.workspace = true
rand.workspace = true
serde_json.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true
derive_more.workspace = true
bytes.workspace = true
flume.workspace = true
thiserror.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
tracing = { workspace = true }

[dev-dependencies]
mcrs_minecraft_worldgen_generator = { workspace = true, features = ["test-support"] }
mcrs_minecraft_worldgen_feature = { workspace = true, features = ["test-support"] }
tracing-subscriber = "0.3"
proptest = "1.11.0"
criterion = { version = "0.7", features = ["html_reports"] }

[features]
telemetry-tracy = ["mcrs_minecraft_worldgen_generator/telemetry-tracy", "mcrs_minecraft_network/telemetry-tracy", "mcrs_minecraft_level/telemetry-tracy"]

[[bench]]
name = "tr07_scale"
harness = false

[[bench]]
name = "tr07_baseline"
harness = false
