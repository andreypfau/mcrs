[package]
name = "mcrs_minecraft_server"
description = "mcrs_minecraft_server"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_chat_server.workspace = true
mcrs_minecraft_game_mode.workspace = true
mcrs_minecraft_command_engine.workspace = true
mcrs_minecraft_command_vanilla.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_worldgen_builtin.workspace = true
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_client_jar = { workspace = true, optional = true }
mcrs_minecraft_datapack.workspace = true
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
mcrs_minecraft_level.workspace = true
mcrs_minecraft_engine.workspace = true
mcrs_minecraft_vanilla_light.workspace = true
mcrs_minecraft_vanilla_worldgen.workspace = true
mcrs_minecraft_network = { workspace = true, features = ["bevy"] }
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_world = { workspace = true, features = ["bevy"] }
bevy_math.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_state.workspace = true
bevy_time.workspace = true
bevy_tasks.workspace = true
bevy_asset.workspace = true
rand.workspace = true
smallvec.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing = { workspace = true }

# Without this a build of the server alone runs every schedule and `par_iter` on one thread.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy_ecs = { workspace = true, features = ["multi_threaded"] }
bevy_asset = { workspace = true, features = ["multi_threaded"] }

[dev-dependencies]
mcrs_minecraft_block_entity.workspace = true
mcrs_minecraft_command.workspace = true
mcrs_minecraft_biome_file.workspace = true
mcrs_minecraft_item = { workspace = true, features = ["bevy"] }
mcrs_minecraft_dimension_environment = { workspace = true, features = ["bevy"] }
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_environment = { workspace = true, features = ["bevy"] }
mcrs_minecraft_chunk = { workspace = true, features = ["bevy"] }
mcrs_minecraft_heightmap = { workspace = true, features = ["bevy"] }
mcrs_minecraft_simulation.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_nbt.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
flume.workspace = true
mcrs_minecraft_light_engine = { workspace = true, features = ["bevy"] }
mcrs_minecraft_command_tree.workspace = true
mcrs_command.workspace = true
mcrs_minecraft_command_argument_vanilla.workspace = true
mcrs_minecraft_chat_client.workspace = true
mcrs_minecraft_world = { workspace = true, features = ["test-support"] }
mcrs_minecraft_fixtures.workspace = true
mcrs_minecraft_worldgen_generator = { workspace = true, features = ["bevy", "test-support"] }
mcrs_minecraft_worldgen_density.workspace = true
criterion = { version = "0.7", features = ["html_reports"] }
mcrs_minecraft_anvil.workspace = true
tokio.workspace = true

[features]
default = ["client-jar"]
client-jar = ["dep:mcrs_minecraft_client_jar"]
telemetry-tracy = ["bevy_ecs/trace", "mcrs_minecraft_vanilla_worldgen/telemetry-tracy", "mcrs_minecraft_network/telemetry-tracy", "mcrs_minecraft_level/telemetry-tracy", "mcrs_minecraft_engine/telemetry-tracy"]

[[bench]]
name = "bot_load"
harness = false
