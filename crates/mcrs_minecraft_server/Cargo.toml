[features]
default = ["client-jar"]
client-jar = ["mcrs_minecraft_engine_server/client-jar"]
telemetry-tracy = ["mcrs_minecraft_engine_server/telemetry-tracy", "mcrs_minecraft_vanilla_worldgen/telemetry-tracy"]

[[bench]]
name = "bot_load"
harness = false

[[bench]]
name = "random_ticks_save"
harness = false
