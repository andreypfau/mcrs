[package]
name = "mcrs_minecraft_update"
description = "Regenerates the data pack corpus and the client jar descriptor from a Minecraft version"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
mcrs_minecraft_biome_file.workspace = true
mcrs_minecraft_biome.workspace = true
mcrs_minecraft_block.workspace = true
mcrs_minecraft_client_jar.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_keys.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_registry.workspace = true
mcrs_minecraft_worldgen_builtin.workspace = true
mcrs_minecraft_worldgen_feature.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
