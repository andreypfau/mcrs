[package]
name = "mcrs_minecraft_protocol_game"
description = "The play-state packets of Minecraft: Java Edition that carry game data: chunks, entities, items, recipes and chat"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_resource.workspace = true
mcrs_voxel.workspace = true
mcrs_minecraft_command_tree.workspace = true
mcrs_minecraft_game_mode.workspace = true
mcrs_minecraft_block.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_particle.workspace = true
mcrs_minecraft_registries.workspace = true
mcrs_minecraft_profile.workspace = true
mcrs_minecraft_text.workspace = true
mcrs_minecraft_item.workspace = true
mcrs_minecraft_recipe.workspace = true
mcrs_minecraft_chunk.workspace = true
mcrs_minecraft_core.workspace = true
glam.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_wire = { workspace = true, features = ["glam", "uuid", "serde"] }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde"] }
bitfield-struct.workspace = true
derive_more = { workspace = true, features = ["from", "into", "deref", "deref_mut", "as_ref"] }

[dev-dependencies]
anyhow.workspace = true
bytes.workspace = true
mcrs_minecraft_engine_registries = { workspace = true, features = ["test-support"] }
mcrs_minecraft_snbt.workspace = true
mcrs_minecraft_sound.workspace = true
mcrs_minecraft_game_registries = { workspace = true, features = ["test-support"] }
criterion = { version = "0.7", features = ["html_reports"] }
rand.workspace = true
serde_json.workspace = true
mcrs_minecraft_fixtures.workspace = true
mcrs_minecraft_registry_catalog.workspace = true
mcrs_test_alloc.workspace = true

[[bench]]
name = "frame"
harness = false
