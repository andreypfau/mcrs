[package]
name = "mcrs_minecraft_client_entity"
description = "The packet side of the client entities that the server adds: the packets that add, move and change an entity, and the network id of each entity"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
glam = { workspace = true, features = ["std"] }
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_client_world.workspace = true
mcrs_minecraft_collision_table.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_engine_entity_motion.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_attribute = { workspace = true, features = ["bevy", "wire"] }
mcrs_minecraft_entity_key.workspace = true
mcrs_minecraft_entity_visual.workspace = true
mcrs_minecraft_item.workspace = true
mcrs_minecraft_network = { workspace = true, features = ["bevy"] }
mcrs_minecraft_numeric.workspace = true
mcrs_minecraft_physics.workspace = true
mcrs_minecraft_protocol_game.workspace = true
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
mcrs_minecraft_volume.workspace = true
mcrs_voxel.workspace = true
tracing.workspace = true

[dev-dependencies]
mcrs_minecraft_pose.workspace = true
mcrs_minecraft_fixtures.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_engine_registries = { workspace = true, features = ["test-support"] }
mcrs_minecraft_game_registries = { workspace = true, features = ["test-support"] }
mcrs_minecraft_game_mode.workspace = true
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_resource.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true
