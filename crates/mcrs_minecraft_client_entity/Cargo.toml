[package]
name = "mcrs_minecraft_client_entity"
description = "The packet side of the client entities that the server adds: the packets that add, move and change an entity, and the network id of each entity"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
glam = { workspace = true, features = ["std"] }
mcrs_minecraft_client_world.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_visual.workspace = true
mcrs_minecraft_network = { workspace = true, features = ["bevy"] }
mcrs_minecraft_protocol_game.workspace = true
tracing.workspace = true

[dev-dependencies]
mcrs_minecraft_fixtures.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_resource.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true
