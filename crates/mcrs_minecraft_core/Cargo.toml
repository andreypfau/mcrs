[package]
name = "mcrs_minecraft_core"
description = "Directions, numeric operations, shapes, codecs and the version"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[build-dependencies]
serde_json.workspace = true

[dependencies]
bevy_ecs = { workspace = true, optional = true }
glam = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_snbt.workspace = true
mcrs_minecraft_wire = { workspace = true, features = ["serde", "voxel", "resource"] }
mcrs_minecraft_resource.workspace = true
mcrs_voxel.workspace = true

[features]
default = []
bevy = ["dep:bevy_ecs", "mcrs_minecraft_resource/bevy", "mcrs_voxel/bevy"]

[dev-dependencies]
mcrs_minecraft_resource.workspace = true
