[package]
name = "mcrs_minecraft_save"
description = "The files of a world save other than its regions: the level, its world generation settings and each player's file"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_anvil.workspace = true
mcrs_minecraft_core.workspace = true
icu_properties = { version = "2.1.2", default-features = false, features = ["compiled_data"] }
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_environment.workspace = true
mcrs_minecraft_game_rule.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_registries.workspace = true
mcrs_minecraft_resource.workspace = true
mcrs_minecraft_game_registries.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
mcrs_minecraft_fixtures.workspace = true
serde_json.workspace = true
mcrs_minecraft_game_registries = { workspace = true, features = ["test-support"] }
