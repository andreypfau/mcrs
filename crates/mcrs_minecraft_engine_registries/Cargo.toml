[package]
name = "mcrs_minecraft_engine_registries"
description = "Loads the registries, blocks and items of an app from its pack files, walks it to playing, and hands the snapshot to each dimension world"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_datapack.workspace = true
mcrs_minecraft_environment = { workspace = true, features = ["bevy"] }
mcrs_minecraft_item = { workspace = true, features = ["bevy"] }
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
mcrs_minecraft_resource.workspace = true
mcrs_minecraft_sound.workspace = true
mcrs_minecraft_game_registries.workspace = true
bevy_app.workspace = true
bevy_asset.workspace = true
bevy_ecs.workspace = true
bevy_platform.workspace = true
bevy_state.workspace = true
bevy_tasks.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
test-support = ["mcrs_minecraft_game_registries/test-support"]
