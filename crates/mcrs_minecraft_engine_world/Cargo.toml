[package]
name = "mcrs_minecraft_engine_world"
description = "Chunk and column entities, dimensions, tickets, area of interest, sessions, the server loop, block updates and drops, game rules, and the world seed, birth clock and entity ids that new entities take"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_resource.workspace = true
mcrs_engine_link.workspace = true
mcrs_engine_cell.workspace = true
mcrs_voxel.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_key.workspace = true
mcrs_minecraft_game_rule.workspace = true
mcrs_minecraft_item.workspace = true
bevy_app.workspace = true
bevy_asset.workspace = true
bevy_derive.workspace = true
bevy_ecs.workspace = true
bevy_math.workspace = true
bevy_platform.workspace = true
bevy_time.workspace = true
flume.workspace = true
indexmap.workspace = true
mcrs_minecraft_block_entity.workspace = true
mcrs_minecraft_chunk = { workspace = true, features = ["bevy"] }
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_simulation.workspace = true
mcrs_minecraft_volume.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[features]
telemetry-tracy = []

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
mcrs_minecraft_random.workspace = true

[[bench]]
name = "random_ticks"
harness = false
