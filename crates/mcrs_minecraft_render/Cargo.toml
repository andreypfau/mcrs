[package]
name = "mcrs_minecraft_render"
description = "Classic terrain and sky renderer, drawn in ordered world pass stages"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
mcrs_minecraft_mesh.workspace = true
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_image",
] }
bytemuck = { version = "1", features = ["derive"] }
bitflags = "2"
# Bevy gives no name to the query-set and pass-timestamp types, and timing a pass needs both.
wgpu = { version = "29", default-features = false }
