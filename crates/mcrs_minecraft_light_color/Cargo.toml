[package]
name = "mcrs_minecraft_light_color"
description = "Light colours of block states and the light a held item emits"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_block.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_chunk.workspace = true
mcrs_minecraft_item.workspace = true
mcrs_minecraft_light_engine.workspace = true
mcrs_minecraft_registries.workspace = true
mcrs_minecraft_volume.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bevy_ecs = { workspace = true, optional = true }

[features]
default = []
bevy = ["dep:bevy_ecs"]

[dev-dependencies]
mcrs_minecraft_volume.workspace = true
mcrs_minecraft_world = { workspace = true, features = ["bevy", "test-support"] }
glam.workspace = true
proptest = "1.11.0"
serde_json.workspace = true
mcrs_minecraft_item = { workspace = true, features = ["bevy"] }
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
mcrs_minecraft_worldgen_testing.workspace = true
bevy_app.workspace = true
bevy_asset.workspace = true

