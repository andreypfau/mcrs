[package]
name = "mcrs_minecraft_goals"
description = "The goals of passive mobs for the AI stage: float, panic, random stroll, look at a player and look around, the random position searches and the goal list of the pig"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
# The workspace entry enables std, which the wasm32v1-none build of this crate does not have.
glam = { version = "0.32.1", default-features = false, features = ["nostd-libm"] }
libm.workspace = true
mcrs_minecraft_brain.workspace = true
mcrs_minecraft_entity = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
mcrs_minecraft_goals = { workspace = true, features = ["testing"] }
rayon.workspace = true

[features]
# A flat pen of pigs with a host that applies the decisions, for tests and benches of the stage.
testing = ["dep:mcrs_minecraft_entity"]

[[bench]]
name = "pig_stage"
harness = false
