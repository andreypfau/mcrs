[package]
name = "mcrs_minecraft_protocol"
description = "Protocol library for Minecraft: Java Edition: framing, compression, and the handshake, status, login and configuration packets"
readme = "README.md"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
bevy = ["dep:bevy_ecs"]

[dependencies]
mcrs_minecraft_resource.workspace = true
bevy_ecs = { workspace = true, optional = true }
mcrs_minecraft_profile.workspace = true
mcrs_minecraft_text.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_wire = { workspace = true, features = ["uuid", "serde"] }
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde"] }
tracing.workspace = true
bytes.workspace = true
bitfield-struct.workspace = true
derive_more = { workspace = true, features = ["from", "into", "deref", "deref_mut", "as_ref"] }
flate2.workspace = true

[dev-dependencies]
rand.workspace = true
