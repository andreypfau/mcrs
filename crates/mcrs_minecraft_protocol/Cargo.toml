[package]
name = "mcrs_minecraft_protocol"
description = "Protocol library for Minecraft: Java Edition"
readme = "README.md"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
bevy = ["dep:bevy_ecs"]

[dependencies]
bevy_ecs = { workspace = true, optional = true }
mcrs_minecraft_block.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_particle.workspace = true
mcrs_minecraft_registries.workspace = true
mcrs_minecraft_profile.workspace = true
mcrs_minecraft_text.workspace = true
mcrs_minecraft_item.workspace = true
mcrs_minecraft_chunk.workspace = true
mcrs_minecraft_core.workspace = true
glam.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_wire = { workspace = true, features = ["glam", "uuid", "serde"] }
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde"] }
tracing.workspace = true
bytes.workspace = true
bitfield-struct.workspace = true
derive_more = { workspace = true, features = ["from", "into", "deref", "deref_mut", "as_ref"] }
flate2.workspace = true

[dev-dependencies]
mcrs_minecraft_sound.workspace = true
mcrs_minecraft_world = { workspace = true, features = ["test-support"] }
criterion = { version = "0.7", features = ["html_reports"] }
rand.workspace = true
serde_json.workspace = true
mcrs_minecraft_fixtures.workspace = true
mcrs_minecraft_registry_catalog.workspace = true

[[bench]]
name = "frame"
harness = false
