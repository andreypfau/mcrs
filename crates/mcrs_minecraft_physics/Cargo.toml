[package]
name = "mcrs_minecraft_physics"
description = "The entity physics kernel: boxes, block shapes, the collision algorithm, step-up and the move procedure"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_pose.workspace = true
mcrs_minecraft_entity_key.workspace = true
glam = { workspace = true, features = ["std"] }
mcrs_voxel.workspace = true
mcrs_minecraft_numeric.workspace = true
bitflags = "2"
rustc-hash.workspace = true
bevy_ecs = { workspace = true, optional = true }
mcrs_minecraft_client_ticks = { workspace = true, optional = true }
mcrs_minecraft_entity = { workspace = true, optional = true }
mcrs_minecraft_entity_attribute = { workspace = true, optional = true }
mcrs_minecraft_resource = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
mcrs_minecraft_client_ticks.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_physics = { workspace = true, features = ["testing"] }

[features]
default = []
bevy = ["dep:bevy_ecs"]
testing = [
    "dep:mcrs_minecraft_client_ticks",
    "dep:mcrs_minecraft_entity",
    "dep:mcrs_minecraft_entity_attribute",
    "dep:mcrs_minecraft_resource",
]

[[bench]]
name = "kernel"
harness = false
