[package]
name = "mcrs_voxel"
description = "Owns the block, section, local and column positions and the block state id of a voxel world; the chunk position type is ColumnPos"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
glam = { workspace = true, features = ["nostd-libm"] }
bevy_ecs = { workspace = true, optional = true }

[features]
default = []
bevy = ["dep:bevy_ecs"]
