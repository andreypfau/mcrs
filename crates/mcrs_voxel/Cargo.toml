[package]
name = "mcrs_voxel"
description = "Block, section, column and local positions and the block state id of a voxel world"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
# The workspace entry enables std, which the wasm32v1-none build of this crate does not have.
glam = { version = "0.33.12", default-features = false, features = ["nostd-libm", "all-types"] }
bevy_ecs = { workspace = true, optional = true }

[features]
default = []
bevy = ["dep:bevy_ecs"]
