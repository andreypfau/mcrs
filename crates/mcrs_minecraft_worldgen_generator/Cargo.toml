[package]
name = "mcrs_minecraft_worldgen_generator"
description = "The column pipeline of the noise chunk generator: fill, surface, carvers, features, structures and the read out of the save"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_voxel.workspace = true
mcrs_minecraft_block_entity.workspace = true
mcrs_minecraft_value_provider.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_biome_file.workspace = true
mcrs_minecraft_block_predicate.workspace = true
bevy_app = { workspace = true, optional = true }
bevy_asset = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
glam.workspace = true
fixedbitset.workspace = true
mcrs_minecraft_anvil.workspace = true
mcrs_minecraft_biome.workspace = true
mcrs_minecraft_block.workspace = true
mcrs_minecraft_chunk.workspace = true
mcrs_minecraft_heightmap.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_random.workspace = true
mcrs_minecraft_volume.workspace = true
mcrs_minecraft_simulation.workspace = true
mcrs_minecraft_registries.workspace = true
mcrs_minecraft_world = { workspace = true, optional = true }
mcrs_minecraft_worldgen = { workspace = true, features = ["fast"] }
mcrs_minecraft_worldgen_carver.workspace = true
mcrs_minecraft_worldgen_density.workspace = true
mcrs_minecraft_worldgen_feature.workspace = true
mcrs_minecraft_worldgen_feature_place.workspace = true
mcrs_minecraft_noise.workspace = true
mcrs_minecraft_worldgen_structure.workspace = true
mcrs_minecraft_worldgen_structure_place.workspace = true
mcrs_minecraft_worldgen_surface.workspace = true
mcrs_minecraft_worldgen_testing = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
rayon.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
bevy_app.workspace = true
bevy_asset.workspace = true
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_world = { workspace = true, features = ["test-support"] }
base64.workspace = true
bytes.workspace = true
criterion = { version = "0.7", features = ["html_reports"] }
mcrs_minecraft_worldgen_feature = { workspace = true, features = ["test-support"] }
mcrs_minecraft_fixtures.workspace = true
mcrs_minecraft_worldgen_testing.workspace = true
mcrs_minecraft_worldgen_generator = { path = ".", features = ["bevy"] }
rand_xoshiro.workspace = true
serde_json.workspace = true

[features]
bevy = ["dep:bevy_ecs", "mcrs_minecraft_heightmap/bevy"]
# The helpers the generation tests share, for the tests of the crates that drive the pipeline.
test-support = ["bevy", "dep:bevy_app", "dep:bevy_asset", "mcrs_minecraft_block/bevy", "dep:bytes", "dep:mcrs_minecraft_worldgen_testing", "dep:serde_json", "mcrs_minecraft_worldgen_feature/test-support", "dep:mcrs_minecraft_world", "mcrs_minecraft_world/test-support"]
telemetry-tracy = []

[[bench]]
name = "beta_chunks"
harness = false

[[bench]]
name = "generate_columns"
harness = false

[[bench]]
name = "overworld_pipeline"
harness = false

[[bench]]
name = "biome_matrix"
harness = false
