[package]
name = "mcrs_minecraft_engine"
description = "The packet bus, the bridge between the network and the dimension worlds, sessions, the host side of the dimension channels, the player state that the host and the dimensions share, the world clocks of the host, and heightmap upkeep"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_biome_file.workspace = true
mcrs_minecraft_block_entity.workspace = true
mcrs_minecraft_dimension_environment = { workspace = true, features = ["bevy"] }
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_simulation.workspace = true
mcrs_minecraft_volume.workspace = true
mcrs_minecraft_world = { workspace = true, features = ["bevy"] }
bevy_asset.workspace = true
bevy_state.workspace = true
bevy_tasks.workspace = true
bevy_time.workspace = true
serde.workspace = true
serde_json.workspace = true
mcrs_minecraft_game_mode.workspace = true
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_chunk = { workspace = true, features = ["bevy"] }
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_environment = { workspace = true, features = ["bevy"] }
mcrs_minecraft_heightmap = { workspace = true, features = ["bevy"] }
mcrs_minecraft_engine_world.workspace = true
mcrs_minecraft_network = { workspace = true, features = ["bevy"] }
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_math.workspace = true
bytes.workspace = true
derive_more.workspace = true
flume.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
mcrs_minecraft_worldgen_generator = { workspace = true, features = ["test-support"] }
mcrs_minecraft_world = { workspace = true, features = ["bevy", "test-support"] }

[features]
telemetry-tracy = []
