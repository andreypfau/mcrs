[package]
name = "mcrs_minecraft_item_stack"
description = "Item stack values: the kind, the count, the component patch and the item component types"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bevy_ecs = { workspace = true, optional = true }
mcrs_minecraft_entity_attribute.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_profile.workspace = true
mcrs_minecraft_resource.workspace = true
mcrs_minecraft_snbt.workspace = true
mcrs_minecraft_text.workspace = true
mcrs_minecraft_wire = { workspace = true, features = ["resource", "voxel"] }
mcrs_voxel.workspace = true
serde.workspace = true

[dev-dependencies]
mcrs_minecraft_fixtures.workspace = true
mcrs_test_alloc.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }

[features]
default = []
bevy = ["dep:bevy_ecs", "mcrs_minecraft_profile/bevy"]
