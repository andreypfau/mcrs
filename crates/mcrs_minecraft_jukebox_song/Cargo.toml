[package]
name = "mcrs_minecraft_jukebox_song"
description = "The JukeboxSong value of the jukebox song registry: its sound event, description, length in seconds and comparator output."
version.workspace = true
edition.workspace = true

[lib]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_core.workspace = true
mcrs_minecraft_registries.workspace = true
mcrs_minecraft_sound = { workspace = true, features = ["registry"] }
mcrs_minecraft_text.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
mcrs_minecraft_fixtures.workspace = true
serde_json.workspace = true
