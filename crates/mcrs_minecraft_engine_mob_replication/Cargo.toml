[package]
name = "mcrs_minecraft_engine_mob_replication"
description = "The replication projection of the mobs of a dimension world in Bevy: reads the row store and the mob changes of the tick and writes the tile events of the mobs for the muxer"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_tasks.workspace = true
mcrs_engine_muxer.workspace = true
mcrs_minecraft_damage.workspace = true
mcrs_minecraft_engine.workspace = true
mcrs_minecraft_engine_physics.workspace = true
mcrs_minecraft_entity_key.workspace = true
mcrs_minecraft_entity_rows = { workspace = true, features = ["bevy"] }
mcrs_minecraft_physics.workspace = true
mcrs_minecraft_replication.workspace = true
rustc-hash.workspace = true
uuid.workspace = true

[dev-dependencies]
glam = { workspace = true, features = ["std"] }
mcrs_minecraft_engine_physics = { workspace = true, features = ["testing"] }
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_protocol_game.workspace = true
