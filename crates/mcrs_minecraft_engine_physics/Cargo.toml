[package]
name = "mcrs_minecraft_engine_physics"
description = "The entity pass of a dimension world in Bevy: the motion plugin, the mob spawn and the crowd damage over the entity components"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_pose.workspace = true
mcrs_minecraft_entity_key.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_tasks.workspace = true
glam = { workspace = true, features = ["std"] }
mcrs_engine_muxer.workspace = true
mcrs_minecraft_block.workspace = true
mcrs_minecraft_collision_table.workspace = true
mcrs_minecraft_damage.workspace = true
mcrs_minecraft_engine_entity_motion.workspace = true
mcrs_minecraft_engine_world.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_attribute.workspace = true
mcrs_minecraft_game_rule.workspace = true
mcrs_minecraft_physics.workspace = true
mcrs_minecraft_protocol_game.workspace = true
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
rustc-hash.workspace = true
mcrs_minecraft_resource.workspace = true
mcrs_minecraft_simulation = { workspace = true, optional = true }
mcrs_minecraft_volume.workspace = true
mcrs_voxel.workspace = true
tracing.workspace = true

[dev-dependencies]
bevy_ecs = { workspace = true, features = ["multi_threaded"] }
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
criterion = { workspace = true }
mcrs_minecraft_engine_physics = { workspace = true, features = ["testing"] }
mcrs_minecraft_fixtures.workspace = true
mcrs_minecraft_game_registries = { workspace = true, features = ["test-support"] }
mcrs_minecraft_simulation.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
testing = ["dep:mcrs_minecraft_simulation", "mcrs_minecraft_physics/testing"]

[[bench]]
name = "entity_pass"
harness = false

[[bench]]
name = "motion_pass"
harness = false
