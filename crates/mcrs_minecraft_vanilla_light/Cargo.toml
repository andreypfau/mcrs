[package]
name = "mcrs_minecraft_vanilla_light"
description = "Vanilla light wired into the dimension worlds: the block light table, the light engine driver of each dimension and the light updates sent to the players"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_chunk = { workspace = true, features = ["bevy"] }
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_engine.workspace = true
mcrs_minecraft_heightmap = { workspace = true, features = ["bevy"] }
mcrs_minecraft_level.workspace = true
mcrs_minecraft_light_engine = { workspace = true, features = ["bevy"] }
mcrs_minecraft_protocol.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
rustc-hash.workspace = true
smallvec.workspace = true

[dev-dependencies]
rayon.workspace = true
