[package]
name = "mcrs_minecraft_replication"
description = "The Minecraft side of entity replication: the muxer codec for players and mobs, mob trackers, delta bases for moves, spawn bundles, profile entries and the player list policy, as encoded packets"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_pose.workspace = true
mcrs_engine_muxer.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_attribute = { workspace = true, features = ["wire"] }
mcrs_minecraft_game_mode.workspace = true
mcrs_minecraft_profile.workspace = true
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_protocol_game.workspace = true
mcrs_minecraft_registries.workspace = true
mcrs_minecraft_wire.workspace = true
mcrs_voxel.workspace = true
bytes.workspace = true
glam = { workspace = true, features = ["std"] }
rustc-hash.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
mcrs_minecraft_resource.workspace = true
