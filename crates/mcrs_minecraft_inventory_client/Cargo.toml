[package]
name = "mcrs_minecraft_inventory_client"
description = "The client edge of the player inventory: the inventory packets of the server applied to the item holders of the local player, and the clicks of the local player predicted and sent"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
mcrs_minecraft_container_click.workspace = true
mcrs_minecraft_engine_inventory_click.workspace = true
mcrs_minecraft_engine_inventory_menu.workspace = true
mcrs_minecraft_engine_item.workspace = true
mcrs_minecraft_engine_registries.workspace = true
mcrs_minecraft_game_mode = { workspace = true, features = ["bevy"] }
mcrs_minecraft_inventory_click.workspace = true
mcrs_minecraft_inventory_menu = { workspace = true, features = ["bevy"] }
mcrs_minecraft_inventory_player.workspace = true
mcrs_minecraft_inventory_transaction.workspace = true
mcrs_minecraft_item_stack.workspace = true
mcrs_minecraft_item_table = { workspace = true, features = ["bevy"] }
mcrs_minecraft_network = { workspace = true, features = ["bevy"] }
mcrs_minecraft_player_holders.workspace = true
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_protocol_game.workspace = true
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
mcrs_voxel.workspace = true
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
mcrs_minecraft_game_registries = { workspace = true, features = ["test-support"] }
mcrs_minecraft_inventory_file.workspace = true
mcrs_minecraft_menu_key.workspace = true
mcrs_minecraft_wire.workspace = true
