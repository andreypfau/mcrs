[package]
name = "mcrs_minecraft_vanilla_block_place"
description = "Vanilla block placing in the dimension worlds: a block item used on a block face places its block"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_block_support = { workspace = true, features = ["bevy"] }
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_engine.workspace = true
mcrs_minecraft_engine_item.workspace = true
mcrs_minecraft_engine_world.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_game_mode.workspace = true
mcrs_minecraft_item = { workspace = true, features = ["bevy"] }
mcrs_minecraft_item_stack = { workspace = true, features = ["bevy"] }
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_physics.workspace = true
mcrs_minecraft_player_slots.workspace = true
mcrs_minecraft_protocol_game.workspace = true
mcrs_minecraft_resource.workspace = true
mcrs_minecraft_text.workspace = true
mcrs_minecraft_volume.workspace = true
mcrs_voxel.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
mcrs_minecraft_engine_registries = { workspace = true, features = ["test-support"] }
