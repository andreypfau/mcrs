[package]
name = "mcrs_minecraft_client"
description = "Minecraft client: window, asset corpus and environment registries"
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "file_watcher",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "keyboard",
    "mouse",
    "png",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
] }
bytemuck = { version = "1", features = ["derive"] }
bitflags = "2"
serde_json.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_voxel_math.workspace = true
mcrs_voxel_world.workspace = true
mcrs_minecraft_world.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_voxel_storage.workspace = true
mcrs_minecraft_protocol.workspace = true
flate2.workspace = true
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_pbr",
    "bevy_image",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
] }
# Bevy gives no name to the query-set and pass-timestamp types, and timing a pass needs both.
wgpu = { version = "29", default-features = false }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLCaptureManager", "MTLDevice"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError"] }

[[example]]
name = "block_viewer"
path = "examples/block_viewer/main.rs"
test = true

[[example]]
name = "anvil_region_viewer"
path = "examples/anvil_region_viewer/main.rs"
test = true
