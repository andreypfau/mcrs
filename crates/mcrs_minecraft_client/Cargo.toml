[package]
name = "mcrs_minecraft_client"
description = "Minecraft client: window, asset corpus, environment registries and the voxel renderer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mcrs_minecraft_client"
test = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_pose.workspace = true
mcrs_minecraft_engine_registries.workspace = true
mcrs_minecraft_resource.workspace = true
mcrs_voxel.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_visual.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_mesh.workspace = true
mcrs_minecraft_model.workspace = true
mcrs_minecraft_model_file.workspace = true
mcrs_minecraft_volume.workspace = true
mcrs_minecraft_render.workspace = true
mcrs_minecraft_fog.workspace = true
mcrs_minecraft_game_mode = { workspace = true, features = ["bevy"] }
mcrs_minecraft_light_render.workspace = true
mcrs_minecraft_render_probe.workspace = true
mcrs_minecraft_random.workspace = true
mcrs_minecraft_noise.workspace = true
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
mcrs_minecraft_biome.workspace = true
mcrs_minecraft_biome_file.workspace = true
mcrs_minecraft_dimension_environment = { workspace = true, features = ["bevy"] }
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_environment = { workspace = true, features = ["bevy"] }
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_datapack.workspace = true
mcrs_minecraft_light_engine.workspace = true
mcrs_minecraft_light_color = { workspace = true, features = ["bevy"] }
mcrs_minecraft_client_jar.workspace = true
mcrs_minecraft_client_world.workspace = true
mcrs_minecraft_client_entity.workspace = true
mcrs_minecraft_entity_render.workspace = true
mcrs_minecraft_profile.workspace = true
mcrs_minecraft_item = { workspace = true, features = ["bevy"] }
mcrs_minecraft_protocol_game.workspace = true
uuid = { workspace = true, optional = true }
mcrs_minecraft_client_gui.workspace = true
mcrs_minecraft_client_options = { workspace = true, features = ["bevy"] }
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_image",
    "keyboard",
    "mouse",
    "png",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
] }
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_network = { workspace = true, features = ["bevy"] }
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_game_registries.workspace = true
mcrs_minecraft_chunk = { workspace = true, features = ["bevy"] }
mcrs_minecraft_engine_world.workspace = true
mcrs_minecraft_engine_item = { workspace = true, optional = true }
mcrs_minecraft_item_stack = { workspace = true, optional = true }
mcrs_minecraft_item_table = { workspace = true, optional = true }
mcrs_minecraft_player_holders.workspace = true
mcrs_minecraft_inventory_client.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mcrs_minecraft_save.workspace = true
time.workspace = true
ureq.workspace = true
bevy = { version = "0.20.1", default-features = false, features = ["file_watcher", "clipboard_image", "multi_threaded"] }
mcrs_minecraft_server = { workspace = true, optional = true }
mcrs_minecraft_engine_server = { workspace = true, optional = true }
mcrs_minecraft_engine = { workspace = true, optional = true }
mcrs_minecraft_server_settings = { workspace = true, optional = true }
mcrs_minecraft_vanilla_worldgen = { workspace = true, optional = true }
mcrs_minecraft_worldgen = { workspace = true, optional = true }
mcrs_minecraft_engine_inventory_menu = { workspace = true, optional = true }
mcrs_minecraft_inventory_menu = { workspace = true, optional = true }
mcrs_minecraft_menu_key = { workspace = true, optional = true }
mcrs_minecraft_text = { workspace = true, optional = true }
tracing-tracy = { version = "0.12", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_family = "wasm")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web", "bevy_clipboard"] }
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
futures-lite.workspace = true
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams"] }

[features]
default = ["singleplayer", "dev"]
pbr = ["bevy/bevy_pbr"]
singleplayer = ["dep:mcrs_minecraft_server", "dep:mcrs_minecraft_engine_server", "dep:mcrs_minecraft_engine", "dep:mcrs_minecraft_server_settings", "dep:mcrs_minecraft_vanilla_worldgen", "dep:mcrs_minecraft_worldgen"]
dev = ["dep:mcrs_minecraft_engine_inventory_menu", "dep:mcrs_minecraft_inventory_menu", "dep:mcrs_minecraft_menu_key", "dep:mcrs_minecraft_text", "dep:mcrs_minecraft_engine_item", "dep:mcrs_minecraft_item_stack", "dep:mcrs_minecraft_item_table"]
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]
scene = ["dep:uuid"]
dynamic_linking = ["bevy/dynamic_linking"]
telemetry-tracy = ["bevy/trace", "dep:tracing-tracy", "mcrs_minecraft_server?/telemetry-tracy"]
test-support = ["dep:mcrs_minecraft_engine_item", "dep:mcrs_minecraft_item_stack", "dep:mcrs_minecraft_item_table"]

[dev-dependencies]
mcrs_minecraft_client = { workspace = true, features = ["test-support"] }
mcrs_minecraft_container_click.workspace = true
mcrs_minecraft_engine_inventory_menu.workspace = true
mcrs_minecraft_engine_item.workspace = true
mcrs_minecraft_inventory_menu.workspace = true
mcrs_minecraft_item_entity = { workspace = true, features = ["bevy"] }
mcrs_minecraft_item_stack.workspace = true
mcrs_minecraft_menu_geometry.workspace = true
mcrs_minecraft_menu_key.workspace = true
mcrs_minecraft_text.workspace = true
mcrs_minecraft_lang.workspace = true
mcrs_minecraft_model = { workspace = true, features = ["test-support"] }
mcrs_minecraft_engine_registries = { workspace = true, features = ["test-support"] }
mcrs_minecraft_game_registries = { workspace = true, features = ["test-support"] }
bytes.workspace = true
mcrs_minecraft_fixtures.workspace = true
mcrs_minecraft_physics.workspace = true
nv-flip = "0.1.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
flate2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLCaptureManager", "MTLDevice"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSProcessInfo"] }

[[example]]
name = "block_viewer"
path = "examples/block_viewer/main.rs"
required-features = ["pbr"]

[[test]]
name = "scene_frames"
path = "tests/scene_frames/main.rs"
required-features = ["scene"]
