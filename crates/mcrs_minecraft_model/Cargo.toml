[package]
name = "mcrs_minecraft_model"
description = "Block and item models baked from a Minecraft resource pack: the pack, model files, sprite atlas, block catalog and item model trees"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
hashbrown.workspace = true
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_client_jar.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_datapack.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_model.workspace = true
mcrs_minecraft_item = { workspace = true, features = ["bevy"] }
mcrs_minecraft_item_key.workspace = true
mcrs_minecraft_mesh.workspace = true
mcrs_minecraft_model_file.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
mcrs_minecraft_resource.workspace = true
mcrs_molang.workspace = true
mcrs_voxel.workspace = true
serde.workspace = true
serde_json.workspace = true
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_image",
    "png",
] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["multi_threaded"] }

[target.'cfg(target_family = "wasm")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web"] }
# The rustflag in .cargo/config.toml picks the backend; without the crate feature of the same
# name getrandom refuses to build at all.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
mcrs_minecraft_block_entity_oracle.workspace = true
mcrs_minecraft_fixtures.workspace = true
mcrs_minecraft_engine_registries = { workspace = true, features = ["test-support"] }

[features]
test-support = []
