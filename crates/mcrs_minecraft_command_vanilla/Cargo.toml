[package]
name = "mcrs_minecraft_command_vanilla"
description = "The vanilla commands execute, gamemode, teleport, locate and time, and the command effects they write"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
default = ["locate"]
locate = [
    "dep:mcrs_minecraft_biome",
    "dep:mcrs_minecraft_worldgen_generator",
    "dep:mcrs_minecraft_worldgen_structure",
]

[dependencies]
mcrs_minecraft_game_mode.workspace = true
mcrs_minecraft_block_entity.workspace = true
mcrs_command.workspace = true
mcrs_minecraft_biome = { workspace = true, optional = true }
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_command.workspace = true
mcrs_minecraft_command_argument_block.workspace = true
mcrs_minecraft_command_argument.workspace = true
mcrs_minecraft_command_engine.workspace = true
mcrs_minecraft_command_argument_entity.workspace = true
mcrs_minecraft_command_registry.workspace = true
mcrs_minecraft_command_argument_vanilla.workspace = true
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_engine.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_environment = { workspace = true, features = ["bevy"] }
mcrs_minecraft_heightmap = { workspace = true, features = ["bevy"] }
mcrs_minecraft_item.workspace = true
mcrs_minecraft_keys.workspace = true
mcrs_minecraft_engine_world.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_registries.workspace = true
mcrs_minecraft_text.workspace = true
mcrs_minecraft_worldgen_generator = { workspace = true, features = ["bevy"], optional = true }
mcrs_minecraft_worldgen_structure = { workspace = true, optional = true }
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_math.workspace = true
rand.workspace = true
tracing.workspace = true
