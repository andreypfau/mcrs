[package]
name = "mcrs_minecraft_worldgen_density"
description = "Density functions, their compiler and evaluator, the noise router and the aquifer"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
bevy_asset = { workspace = true, optional = true }
bevy_reflect = { workspace = true, optional = true }
bevy_math.workspace = true
mcrs_minecraft_chunk.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_random.workspace = true
mcrs_minecraft_worldgen_noise.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
mcrs_minecraft_worldgen_testing.workspace = true
mcrs_minecraft_worldgen_density = { path = ".", default-features = false, features = ["eval-count"] }

[features]
default = ["fast"]
bevy = ["dep:bevy_asset", "dep:bevy_reflect"]
# Counts node evaluations for the tests that prove a cone was skipped.
eval-count = []
fast = ["mcrs_minecraft_worldgen_noise/fast"]
