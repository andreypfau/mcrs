[package]
name = "mcrs_minecraft_worldgen"
description = "mcrs_minecraft_worldgen"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
mcrs_minecraft_core.workspace = true
mcrs_voxel_storage.workspace = true
mcrs_minecraft_random.workspace = true
bevy_math.workspace = true
bevy_app = { workspace = true, optional = true }
bevy_asset = { workspace = true, optional = true }
bevy_reflect = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
default = ["bevy"]
bevy = ["dep:bevy_app", "dep:bevy_ecs", "dep:bevy_asset", "dep:bevy_reflect", "dep:thiserror"]
# The precision profile of `docs/worldgen.md` §15, one feature per technique so
# a divergence can be bisected to the one that caused it. `fast` is the shipping
# union; the parts are for measuring, not for shipping separately.
fast = ["fast_fma", "fast_cell"]
# One rounding instead of two wherever a sampler computes `a * b + c`. Needs an
# FMA instruction to be a win: `target-cpu=native`, or `+fma` on x86-64.
fast_fma = []
# Collapses a lattice cell to a line along Y, which is the direct formula for
# the vertical interpolation recurrence.
fast_cell = []
far-lands = []
