[package]
name = "mcrs_minecraft_worldgen"
description = "mcrs_minecraft_worldgen"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
mcrs_minecraft_core.workspace = true
mcrs_voxel_storage.workspace = true
mcrs_minecraft_random.workspace = true
bevy_math.workspace = true
bevy_app = { workspace = true, optional = true }
bevy_asset = { workspace = true, optional = true }
bevy_reflect = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
default = ["bevy", "fast"]
bevy = ["dep:bevy_app", "dep:bevy_ecs", "dep:bevy_asset", "dep:bevy_reflect", "dep:thiserror"]
# The fast precision profile of `docs/worldgen.md` §15: one rounding instead of
# two wherever a sampler computes `a * b + c`, and a noise sampler's lattice cell
# collapsed to a line along Y so its eight corner dots become two ends of a
# segment. Needs an FMA instruction to be a win: `target-cpu=native`, or `+fma`
# on x86-64. Off is the strict profile, which stays buildable as the oracle.
fast = []
