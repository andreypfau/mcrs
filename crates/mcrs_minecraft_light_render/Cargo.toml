[package]
name = "mcrs_minecraft_light_render"
description = "Coloured block light for the lighting pass: a paged light volume propagated on the GPU"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_voxel.workspace = true
mcrs_minecraft_render.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
mcrs_minecraft_chunk.workspace = true
mcrs_minecraft_item = { workspace = true, features = ["bevy"] }
mcrs_minecraft_light_color = { workspace = true, features = ["bevy"] }
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_image",
] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
mcrs_minecraft_engine_registries = { workspace = true, features = ["test-support"] }
mcrs_minecraft_game_registries = { workspace = true, features = ["test-support"] }
