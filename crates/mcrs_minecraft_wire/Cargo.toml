[package]
name = "mcrs_minecraft_wire"
description = "Encode and decode traits, variable-length integers and primitive codecs for the Minecraft: Java Edition protocol"
readme = "README.md"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
mcrs_minecraft_wire_macros.workspace = true
glam = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
mcrs_voxel = { workspace = true, optional = true }
mcrs_minecraft_resource = { workspace = true, optional = true }

[features]
resource = ["dep:mcrs_minecraft_resource"]
voxel = ["dep:mcrs_voxel"]

[dev-dependencies]
mcrs_minecraft_wire = { path = ".", features = ["voxel"] }
rand.workspace = true
