[package]
name = "mcrs_minecraft_engine_entity_motion_replication"
description = "The replication of the moving entities, such as mobs, items and falling blocks: their network ids and their tile events for the muxer"
version.workspace = true
edition.workspace = true

[lib]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
mcrs_engine_muxer.workspace = true
mcrs_minecraft_damage = { workspace = true, features = ["bevy"] }
mcrs_minecraft_engine_damage.workspace = true
mcrs_minecraft_engine.workspace = true
mcrs_minecraft_engine_entity_motion.workspace = true
mcrs_minecraft_engine_mob_attributes.workspace = true
mcrs_minecraft_engine_physics.workspace = true
mcrs_minecraft_engine_world.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_attribute.workspace = true
mcrs_minecraft_entity_key.workspace = true
mcrs_minecraft_physics.workspace = true
mcrs_minecraft_replication.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
bevy_ecs = { workspace = true, features = ["multi_threaded"] }
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
glam.workspace = true
mcrs_minecraft_engine_physics = { workspace = true, features = ["testing"] }
mcrs_minecraft_physics = { workspace = true, features = ["testing"] }
mcrs_minecraft_protocol_game.workspace = true
mcrs_voxel.workspace = true
