[package]
name = "mcrs_minecraft_entity_key"
description = "The keys of an entity without the physics kernel: its id, its UUID as its order key, the sources of a new UUID, its keyed random stream and the tile that holds it"
version.workspace = true
edition.workspace = true

[lib]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
bevy_ecs = { workspace = true, optional = true }
glam = { workspace = true, features = ["nostd-libm"] }
mcrs_voxel.workspace = true
uuid = { version = "1.18.1", default-features = false }

[features]
bevy = ["dep:bevy_ecs"]
