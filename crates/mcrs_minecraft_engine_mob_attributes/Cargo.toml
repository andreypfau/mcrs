[package]
name = "mcrs_minecraft_engine_mob_attributes"
description = "The attribute instances of the mob rows of a dimension world: the apply system of their edits and the motion values of their rows"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

# std: the row table is a hash map, and bevy_app
[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
mcrs_minecraft_engine_physics.workspace = true
mcrs_minecraft_engine_world.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_attribute.workspace = true
mcrs_minecraft_entity_key.workspace = true
mcrs_minecraft_entity_rows = { workspace = true, features = ["bevy"] }
mcrs_minecraft_physics.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
glam = { workspace = true, features = ["std"] }
mcrs_minecraft_protocol_game.workspace = true
mcrs_minecraft_resource.workspace = true
