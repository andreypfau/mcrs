[package]
name = "mcrs_minecraft_entity_attribute"
description = "The entity attributes, their modifier operations and the computation of an attribute value from its base value and its modifiers"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bevy_ecs = { workspace = true, optional = true }
mcrs_minecraft_resource.workspace = true
mcrs_minecraft_static_registry.workspace = true
mcrs_minecraft_wire = { workspace = true, features = ["resource"], optional = true }
serde = { workspace = true, optional = true }

[features]
default = []
bevy = ["dep:bevy_ecs"]
serde = ["dep:serde", "std"]
std = ["mcrs_minecraft_static_registry/std"]
wire = ["dep:mcrs_minecraft_wire"]

[dev-dependencies]
mcrs_minecraft_entity_attribute = { path = ".", features = ["serde", "wire"] }
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_snbt.workspace = true
mcrs_minecraft_fixtures.workspace = true
serde.workspace = true
serde_json.workspace = true
