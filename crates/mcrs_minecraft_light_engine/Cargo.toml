[package]
name = "mcrs_minecraft_light_engine"
description = "Block and sky light propagation over sections, without Bevy"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_block.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_chunk.workspace = true
mcrs_minecraft_volume.workspace = true
bevy_ecs = { workspace = true, optional = true }
rayon.workspace = true
rustc-hash.workspace = true
tracing.workspace = true

[features]
default = []
bevy = ["dep:bevy_ecs"]

[dev-dependencies]
bevy_app.workspace = true
bevy_asset.workspace = true
mcrs_minecraft_block = { workspace = true, features = ["bevy"] }
glam.workspace = true
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
