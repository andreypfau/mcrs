[package]
name = "mcrs_minecraft_item"
description = "Item definitions and the item table, data components, ComponentPatch, wire and hashed stack forms, and the ItemStack of an item id and a count"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
bevy = [
    "dep:bevy_ecs",
    "mcrs_minecraft_core/bevy",
    "mcrs_minecraft_profile/bevy",
]

[lints]
workspace = true

[dependencies]
hashbrown.workspace = true
mcrs_minecraft_resource.workspace = true
mcrs_voxel.workspace = true
mcrs_minecraft_registries.workspace = true
mcrs_minecraft_block.workspace = true
mcrs_minecraft_dimension.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_entity_attribute = { workspace = true, features = ["serde", "wire"] }
mcrs_minecraft_loot.workspace = true
mcrs_minecraft_sound = { workspace = true, features = ["registry"] }
mcrs_minecraft_block_predicate.workspace = true
mcrs_minecraft_value_provider.workspace = true
bevy_ecs = { workspace = true, optional = true }
mcrs_minecraft_item_key.workspace = true
mcrs_minecraft_potion.workspace = true
mcrs_minecraft_block_transformer.workspace = true
mcrs_minecraft_decorated_pot_pattern.workspace = true
mcrs_minecraft_banner_pattern = { workspace = true, features = ["registry"] }
mcrs_minecraft_map_decoration.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_snbt.workspace = true
mcrs_minecraft_profile.workspace = true
mcrs_minecraft_text.workspace = true
mcrs_minecraft_wire.workspace = true
anyhow.workspace = true
crc32c.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
mcrs_minecraft_worldgen_testing.workspace = true
mcrs_minecraft_fixtures.workspace = true
