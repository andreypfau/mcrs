[package]
name = "mcrs_minecraft_item"
description = "Items, item data components, the component patch, the persistent item stack, enchantments and armour trims"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
bevy = [
    "dep:bevy_ecs",
    "mcrs_minecraft_core/bevy",
    "mcrs_minecraft_profile/bevy",
    "mcrs_minecraft_registry/bevy",
]

[dependencies]
bevy_ecs = { workspace = true, optional = true }
mcrs_minecraft_core.workspace = true
mcrs_minecraft_nbt.workspace = true
mcrs_minecraft_profile.workspace = true
mcrs_minecraft_registry.workspace = true
mcrs_minecraft_keys.workspace = true
mcrs_minecraft_text.workspace = true
anyhow.workspace = true
crc32c.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
mcrs_minecraft_registry = { workspace = true, features = ["test-support"] }
mcrs_minecraft_worldgen_testing.workspace = true
