[package]
name = "mcrs_minecraft_engine_brain"
description = "The AI stage of the mobs of a dimension world: the snapshot of the mob entities, the stage run per tile beside the entity pass, the decisions applied through the mob controls"
version.workspace = true
edition.workspace = true

[lib]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_entity_key = { workspace = true, features = ["bevy"] }
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_tasks.workspace = true
bevy_utils.workspace = true
glam = { workspace = true, features = ["std"] }
mcrs_minecraft_brain.workspace = true
mcrs_minecraft_damage = { workspace = true, features = ["bevy"] }
mcrs_minecraft_engine.workspace = true
mcrs_minecraft_engine_entity_motion.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_engine_physics.workspace = true
mcrs_minecraft_engine_world.workspace = true
mcrs_minecraft_game_mode = { workspace = true, features = ["bevy"] }
mcrs_minecraft_goal_world.workspace = true
mcrs_minecraft_mob_control.workspace = true
mcrs_minecraft_physics.workspace = true
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
mcrs_minecraft_resource.workspace = true
mcrs_minecraft_volume.workspace = true
mcrs_voxel.workspace = true
tracing.workspace = true

[dev-dependencies]
mcrs_minecraft_engine_damage.workspace = true
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
mcrs_minecraft_engine_physics = { workspace = true, features = ["testing"] }
mcrs_minecraft_goals.workspace = true
mcrs_minecraft_physics = { workspace = true, features = ["testing"] }
mcrs_minecraft_pose = { workspace = true, features = ["bevy"] }
mcrs_minecraft_protocol_game.workspace = true
