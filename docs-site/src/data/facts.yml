# Counts and ids that more than one page repeats. Every entry says how to measure it; re-measure on a version bump.
crates: { value: 122, how: "cargo metadata --no-deps --format-version 1 | jq '[.packages[] | select(.manifest_path | contains(\"/crates/\"))] | length'" }
crates_no_bevy: { value: 100, how: "length of NO_BEVY_PACKAGES in xtask/src/checks.rs" }
crates_no_std: { value: 9, how: "length of NO_STD_PACKAGES in xtask/src/checks.rs" }
crates_wasm32: { value: 11, how: "length of WASM32_PACKAGES in xtask/src/checks.rs" }
registries: { value: 147, how: "PERF.md#server-start" }
registry_entries: { value: 9079, how: "PERF.md#server-start" }
fixtures: { value: 49, how: "jq 'length' tools/fixtures.json" }
root_commands: { value: 20, how: "count literal(NodeId::ROOT, ...) in crates/mcrs_minecraft_command_vanilla and crates/mcrs_minecraft_command_world, minus the alias tp (21 names)" }
