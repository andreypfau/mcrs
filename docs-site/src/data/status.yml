- id: worldgen
  title: { en: World generation, ru: Генерация мира }
  works:
    en: "Noise, surface, aquifers, carvers, features and structures. The output is compared element by element with dumps of the real game (about 14 of the {fixtures} entries in tools/fixtures.json belong to world generation). Presets normal and flat."
    ru: "Шум, поверхность, аквиферы, карверы, фичи и структуры. Результат сравнивается поэлементно с дампами настоящей игры (около 14 из {fixtures} записей tools/fixtures.json относятся к генерации мира). Пресеты normal и flat."
  missing:
    en: "Parity is checked on reference seeds and chunks, not on every seed. Entities from generated structures are not done."
    ru: "Совпадение проверено на эталонных сидах и чанках, а не на любом сиде. Сущности из сгенерированных структур не сделаны."
  state: works
  issues: [170, 523]
  evidence: "cargo nextest run -p mcrs_minecraft_worldgen_generator -p mcrs_minecraft_worldgen_density (needs the client jar)"
  verified: 2026-11-17

- id: lighting
  title: { en: Lighting, ru: Свет }
  works:
    en: "Sky light and block light from the light engine crates, with a bulk-load example."
    ru: "Небесный и блочный свет в крейтах светового движка, есть пример массовой загрузки."
  missing:
    en: "Coloured block light exists but is not on by default."
    ru: "Цветной блочный свет есть, но по умолчанию выключен."
  state: partial
  issues: [346]
  evidence: "crates/mcrs_minecraft_vanilla_light/examples/bulk_load.rs"
  verified: 2026-11-17

- id: client
  title: { en: Client and rendering, ru: Клиент и рендер }
  works:
    en: "Terrain, sky, clouds, fog, light, mobs, players with skins and poses, sign text, the F3 overlay, chat, the title screen with the list of local worlds, the pause menu and the options screens, the inventory and eight generic container screens with mouse and key clicks, drag previews, double clicks and item tooltips, the creative inventory with tabs, scrolling and search, the hotbar, block breaking in creative. Render distance 96 columns by default, and the video settings change it."
    ru: "Рельеф, небо, облака, туман, свет, мобы, игроки со скинами и позами, текст табличек, оверлей F3, чат, титульный экран со списком локальных миров, меню паузы и экраны настроек, экран инвентаря и восемь типовых экранов контейнеров с кликами мышью и клавишами, предпросмотром перетаскивания, двойными кликами и подсказками предметов, творческий инвентарь со вкладками, прокруткой и поиском, хотбар, ломание блоков в креативе. Дальность по умолчанию 96 колонок, ее меняют настройки графики."
  missing:
    en: "The web build loads a world on WebGPU and WebGL2, but it does not reach a steady frame yet. No sound, particles or weather. Creative saved hotbars and the player figure in the creative survival tab are missing. Special item models draw no icon. Item tooltips lack enchantment lines and italics, and can undercount components."
    ru: "Веб-сборка загружает мир на WebGPU и WebGL2, но стабильного кадра пока не держит. Нет звука, частиц и погоды. Нет сохраненных творческих хотбаров и фигурки игрока во вкладке инвентаря выживания творческого экрана. Особые модели предметов не рисуют значок. В подсказках предметов нет строк зачарований и курсива, а число компонентов может быть занижено."
  state: partial
  issues: [337, 344, 130, 131, 1032, 1043, 1021, 1022, 1023]
  evidence: "crates/mcrs_minecraft_client/tests/it/screen_clicks.rs; crates/mcrs_minecraft_client/tests/it/creative_screen_clicks.rs; crates/mcrs_minecraft_client_gui/src/menu_item_tooltip.rs"
  verified: 2026-11-18

- id: protocol
  title: { en: Protocol, ru: Протокол }
  works:
    en: "Handshake, status, login, configuration and play. 72 of 144 clientbound and 52 of 69 serverbound play packets are typed."
    ru: "Handshake, status, login, configuration и play. Типизировано 72 из 144 clientbound и 52 из 69 serverbound play-пакетов."
  missing:
    en: "The other play packets travel as raw bytes. Only one game version at a time; translation for older clients is planned."
    ru: "Остальные play-пакеты идут сырыми байтами. Одна версия игры за раз, трансляция для старых клиентов только запланирована."
  state: partial
  issues: [295, 537]
  evidence: "crates/mcrs_minecraft_protocol/src/packets/table.rs"
  verified: 2026-11-17

- id: network
  title: { en: Network, ru: Сеть }
  works:
    en: "TCP with compression, status with MOTD and icon, transfer, LAN announce, whitelist and bans. Velocity modern forwarding, the PROXY protocol from trusted upstreams, a player cap, per-IP and join-rate limits, a packet rate limit and a budget for the NBT in one serverbound packet."
    ru: "TCP со сжатием, status с MOTD и иконкой, transfer, LAN-анонс, whitelist и баны. Modern forwarding от Velocity, PROXY protocol от доверенных апстримов, лимит игроков, лимиты на IP и на частоту входов, лимит частоты пакетов и бюджет NBT в одном пакете от клиента."
  missing:
    en: "No online mode and no encryption: a player who connects to the server directly joins under any name. The legacy BungeeCord forwarding is not supported."
    ru: "Нет online mode и шифрования: игрок, который подключается к серверу напрямую, входит под любым ником. Старый форвардинг BungeeCord не поддерживается."
  state: partial
  issues: [82, 296]
  evidence: "crates/mcrs_minecraft_server/tests/it/login_handshake_e2e.rs"
  verified: 2026-11-18

- id: persistence
  title: { en: Saving and Anvil, ru: Сохранения и Anvil }
  works:
    en: "Reads an existing Java Edition world and writes changed chunks back to its region files. Autosave runs every 6000 ticks, and a clean shutdown saves the world and the players. A damaged region is copied aside before anything is written over it."
    ru: "Читает существующий мир Java Edition и записывает измененные чанки обратно в его файлы регионов. Автосохранение идет каждые 6000 тиков, а чистое выключение сохраняет мир и игроков. Поврежденный регион копируется в сторону до того, как поверх него что-то запишется."
  missing:
    en: "Container contents changed in play and entities in chunks are not saved yet. A world of another data version does not load, and there are no datafixers."
    ru: "Измененное в игре содержимое контейнеров и сущности в чанках пока не сохраняются. Мир другой версии данных не загружается, датафиксеров нет."
  state: partial
  issues: [910]
  evidence: "crates/mcrs_minecraft_server/tests/it/anvil_block_states.rs"
  verified: 2026-11-17

- id: gameplay
  title: { en: Gameplay, ru: Геймплей }
  works:
    en: "Join, chat with a cancellable event before broadcast, game modes, block placing, block breaking in creative and by hand in survival, block drops from loot tables, item entities and their pickup, the player inventory with armour slots, menus that a plugin opens as data, creative clicks from the client, the pose of players, falling blocks, removal of blocks that lose their support, random ticks and block events."
    ru: "Вход, чат с отменяемым событием до рассылки, режимы игры, установка блоков, ломание блоков в креативе и рукой в выживании, дроп блоков по таблицам лута, предметы на земле и их подбор, инвентарь игрока со слотами брони, меню, которые плагин открывает как данные, творческие клики клиента, поза игроков, падающие блоки, разрушение блоков без опоры, случайные тики и блочные события."
  missing:
    en: "Crafting, combat, redstone, fluids, plant growth, trading, bosses. A tool digs no faster than an empty hand. No survival loop yet."
    ru: "Крафт, бой, редстоун, жидкости, рост растений, торговля, боссы. Инструмент копает не быстрее пустой руки. Цикла выживания пока нет."
  state: partial
  issues: [182, 190]
  evidence: "crates/mcrs_minecraft_server/tests/it/chat.rs; crates/mcrs_minecraft_client/tests/it/creative_actions.rs"
  verified: 2026-11-18

- id: commands
  title: { en: Commands, ru: Команды }
  works:
    en: "Command parser and tree, the commands packet and tab hints. {root_commands} vanilla commands, among them execute, gamemode, tp, summon, kill, data, time, fill, whitelist and ban."
    ru: "Парсер и дерево команд, пакет commands и подсказки по Tab. {root_commands} команд ванили, среди них execute, gamemode, tp, summon, kill, data, time, fill, whitelist и ban."
  missing:
    en: "A command tree with permission levels is still open."
    ru: "Дерево команд с уровнями прав пока открыто."
  state: partial
  issues: [285]
  evidence: "crates/mcrs_minecraft_server/tests/it/commands.rs"
  verified: 2026-11-17

- id: entities
  title: { en: Entities and mobs, ru: Сущности и мобы }
  works:
    en: "Entity rows by tile, 5 mob types with data (pig, cow, sheep, chicken, zombified piglin), AI for pigs, cows, sheep and chickens (panic, stroll, look at a player), item entities, falling blocks, attributes with modifiers, replication to clients."
    ru: "Строки сущностей по тайлам, 5 типов мобов с данными (свинья, корова, овца, курица, зомби-свинолюд), ИИ свиней, коров, овец и куриц (паника, прогулка, взгляд на игрока), предметы на земле, падающие блоки, атрибуты с модификаторами, репликация клиентам."
  missing:
    en: "Most other mobs and their AI. The 50,000-pig benchmark is marked provisional by its author, so we publish no numbers from it."
    ru: "Большинство остальных мобов и их ИИ. Бенчмарк на 50 000 свиней автор сам пометил как предварительный, поэтому его цифр мы не публикуем."
  state: partial
  issues: [102, 224]
  evidence: "crates/mcrs_minecraft_server/tests/it/mob_ai.rs"
  verified: 2026-11-17

- id: physics
  title: { en: Physics and movement, ru: Физика и движение }
  works:
    en: "Physics kernel with collisions and impulses, a movement check for players, comparison with recordings of the vanilla client. Results do not depend on the thread count. The client moves the local player with the same movement kernel, and a public kernel selects the pose of a player. Teleport confirmation follows its specification, and scripted-client tests check it."
    ru: "Ядро физики с коллизиями и импульсами, проверка движения игрока, сверка с записями ванильного клиента. Результат не зависит от числа потоков. Клиент двигает локального игрока тем же ядром движения, а позу игрока выбирает публичное ядро. Подтверждение телепорта работает по спецификации, его проверяют тесты со скриптовым клиентом."
  missing:
    en: "The teleport confirmation spec still has open questions about Bedrock clients."
    ru: "В спецификации подтверждения телепорта остались открытые вопросы про клиентов Bedrock."
  state: works
  issues: [85, 623]
  evidence: "cargo nextest run -p mcrs_minecraft_engine_physics -p mcrs_minecraft_server tick_determinism"
  verified: 2026-11-17

- id: datapacks
  title: { en: Data packs and registries, ru: Датапаки и реестры }
  works:
