- id: worldgen
  title: { en: World generation, ru: Генерация мира }
  works:
    en: "Noise, surface, aquifers, carvers, features and structures. The output is compared element by element with dumps of the game; 13 of the {fixtures} entries in tools/fixtures.json write fixtures into world generation crates. Presets normal and flat. A server benchmark measures generation from load tickets to loaded sections."
    ru: "Шум, поверхность, аквиферы, карверы, фичи и структуры. Результат сравнивается поэлементно с дампами игры; 13 из {fixtures} записей tools/fixtures.json записывают фикстуры в крейты генерации мира. Пресеты normal и flat. Серверный бенчмарк измеряет генерацию от тикетов загрузки до загруженных секций."
  missing:
    en: "Parity is checked on reference seeds and chunks, not on every seed. Entities from generated structures are not done."
    ru: "Совпадение проверено на эталонных сидах и чанках, а не на любом сиде. Сущности из сгенерированных структур не сделаны."
  state: works
  issues: [170, 523, 173, 1009]
  evidence: "crates/mcrs_minecraft_worldgen_generator/src/tests/biome_parity.rs; crates/mcrs_minecraft_server/benches/worldgen_throughput.rs; tools/fixtures.json"
  verified: 2026-11-23

- id: lighting
  title: { en: Lighting, ru: Свет }
  works:
    en: "Sky light and block light from the light engine crates, with a bulk-load example."
    ru: "Небесный и блочный свет в крейтах светового движка, есть пример массовой загрузки."
  missing:
