- id: client
  title: { en: Client and rendering, ru: Клиент и рендер }
  works:
    en: "Terrain, sky, clouds, fog, light, mobs, players with skins and poses, player and mob name tags, sign text, the F3 overlay, chat, the title screen with local worlds, pause and options screens, the inventory and eight generic container screens with mouse and key clicks, drag previews, double clicks and tooltips, creative tabs, scrolling and search, the hotbar and creative block breaking. The native client has health and food bars and a death screen with respawn. Render distance is 96 columns by default and changes in video settings."
    ru: "Рельеф, небо, облака, туман, свет, мобы, игроки со скинами и позами, подписи игроков и мобов, текст табличек, оверлей F3, чат, титульный экран с локальными мирами, меню паузы и настройки, инвентарь и восемь типовых экранов контейнеров с кликами мышью и клавишами, предпросмотром перетаскивания, двойными кликами и подсказками, творческие вкладки, прокрутка и поиск, хотбар и ломание блоков в креативе. В нативном клиенте есть полосы здоровья и еды и экран смерти с возрождением. Дальность по умолчанию 96 колонок, ее меняют настройки графики."
  missing:
    en: "Web CPU/GPU frame times are not measured; WebGL2 draws no mobs, and the browser entry point adds no GUI, health HUD or death screen. No sound, particles or weather. Absorption and special heart forms, blinking and the regeneration wave are missing. Name tags do not yet receive crosshair, hidden-HUD or passenger inputs. Creative saved hotbars and the player figure in the creative survival tab are missing. Special item models draw no icon. Tooltips lack enchantment lines and italics and can undercount components."
    ru: "Время кадра на CPU и GPU в веб-сборке не измерено; WebGL2 не рисует мобов, а браузерная точка входа не добавляет GUI, индикаторы здоровья и экран смерти. Нет звука, частиц и погоды. Нет поглощения, особых видов сердец, мигания и волны регенерации. Подписи пока не получают данные о цели под прицелом, скрытом HUD и пассажирах. Нет сохраненных творческих хотбаров и фигурки игрока во вкладке инвентаря выживания творческого экрана. Особые модели предметов не рисуют значок. В подсказках нет строк зачарований и курсива, а число компонентов может быть занижено."
  state: partial
  issues: [337, 344, 130, 131, 1032, 1043, 1021, 1022, 1023, 1060, 1061, 106, 1083]
  evidence: "crates/mcrs_minecraft_client/tests/it/screen_clicks.rs; crates/mcrs_minecraft_client/tests/it/creative_screen_clicks.rs; crates/mcrs_minecraft_client_gui/src/menu_item_tooltip.rs; crates/mcrs_minecraft_client_gui/src/health_hud.rs; crates/mcrs_minecraft_client_gui/src/death_screen_plugin.rs; crates/mcrs_minecraft_client/src/name_tag.rs; crates/mcrs_minecraft_client/src/web.rs"
  verified: 2026-11-23

- id: protocol
  title: { en: Protocol, ru: Протокол }
  works:
    en: "Handshake, status, login, configuration and play. 76 of 144 clientbound and 52 of 69 serverbound play packets are typed."
    ru: "Handshake, status, login, configuration и play. Типизировано 76 из 144 clientbound и 52 из 69 serverbound play-пакетов."
  missing:
    en: "The other play packets travel as raw bytes. Only one game version at a time; translation for older clients is planned."
    ru: "Остальные play-пакеты идут сырыми байтами. Одна версия игры за раз, трансляция для старых клиентов только запланирована."
  state: partial
  issues: [295, 537]
  evidence: "crates/mcrs_minecraft_protocol/src/packets/table.rs; crates/mcrs_minecraft_protocol_game/src/table.rs; crates/mcrs_minecraft_protocol_game/tests/it/packet_tables.rs"
  verified: 2026-11-23

- id: network
  title: { en: Network, ru: Сеть }
  works:
    en: "TCP with compression, status with MOTD and icon, transfer, LAN announce, whitelist and bans. Velocity modern forwarding, the PROXY protocol from trusted upstreams, a player cap, per-IP and join-rate limits, a packet rate limit and a budget for the NBT in one serverbound packet."
    ru: "TCP со сжатием, status с MOTD и иконкой, transfer, LAN-анонс, whitelist и баны. Modern forwarding от Velocity, PROXY protocol от доверенных апстримов, лимит игроков, лимиты на IP и на частоту входов, лимит частоты пакетов и бюджет NBT в одном пакете от клиента."
  missing:
    en: "No online mode and no encryption: a player who connects to the server directly joins under any name. The legacy BungeeCord forwarding is not supported."
    ru: "Нет online mode и шифрования: игрок, который подключается к серверу напрямую, входит под любым ником. Старый форвардинг BungeeCord не поддерживается."
  state: partial
  issues: [82, 296]
  evidence: "crates/mcrs_minecraft_server/tests/it/login_handshake_e2e.rs"
  verified: 2026-11-18

- id: persistence
  title: { en: Saving and Anvil, ru: Сохранения и Anvil }
  works:
    en: "Reads an existing Java Edition world and writes changed chunks back to its region files. Autosave runs every 6000 ticks, and a clean shutdown saves the world and the players. A damaged region is copied aside before anything is written over it."
    ru: "Читает существующий мир Java Edition и записывает измененные чанки обратно в его файлы регионов. Автосохранение идет каждые 6000 тиков, а чистое выключение сохраняет мир и игроков. Поврежденный регион копируется в сторону до того, как поверх него что-то запишется."
  missing:
    en: "Container contents changed in play and entities in chunks are not saved yet. A world of another data version does not load, and there are no datafixers."
    ru: "Измененное в игре содержимое контейнеров и сущности в чанках пока не сохраняются. Мир другой версии данных не загружается, датафиксеров нет."
  state: partial
  issues: [910]
  evidence: "crates/mcrs_minecraft_server/tests/it/anvil_block_states.rs"
  verified: 2026-11-17

- id: gameplay
  title: { en: Gameplay, ru: Геймплей }
  works:
    en: "Join, cancellable chat, game modes, block placement, creative and bare-hand survival breaking, loot-table drops, item entities and pickup, the player inventory with armour slots, menus opened as data, creative clicks, player poses, falling blocks, loss of block support, random ticks and block events. Player health, command damage, death and world-spawn respawn work, with inventory drops and death messages. Observers receive player arm swings."
    ru: "Вход, отменяемый чат, режимы игры, установка блоков, ломание в креативе и рукой в выживании, дроп по таблицам лута, предметы на земле и подбор, инвентарь игрока со слотами брони, меню как данные, творческие клики, позы игроков, падающие блоки, потеря опоры блоками, случайные тики и блочные события. Работают здоровье игрока, урон от команд, смерть и возрождение в точке спавна мира, дроп инвентаря и сообщения о смерти. Наблюдатели получают взмахи рук игроков."
  missing:
    en: "Player melee attacks, own-player knockback and camera hurt tilt, crafting, redstone, fluids, plant growth, trading and bosses. Respawn has incomplete resets and resends and does not use beds or anchors. A tool digs no faster than an empty hand. No complete survival loop yet."
    ru: "Ближние атаки игрока, отбрасывание своего игрока и наклон камеры при уроне, крафт, редстоун, жидкости, рост растений, торговля и боссы. При возрождении сброс состояния и повторная отправка данных неполны, кровати и якоря не используются. Инструмент копает не быстрее пустой руки. Полного цикла выживания пока нет."
  state: partial
  issues: [182, 190, 103, 106, 116, 906, 1083]
  evidence: "crates/mcrs_minecraft_server/tests/it/chat.rs; crates/mcrs_minecraft_client/tests/it/creative_actions.rs; crates/mcrs_minecraft_server/tests/it/mob_replication.rs; crates/mcrs_minecraft_server/tests/it/death_drops.rs; crates/mcrs_minecraft_server/tests/it/death_messages.rs; crates/mcrs_minecraft_vanilla_swing/tests/it/main.rs"
  verified: 2026-11-23

- id: commands
  title: { en: Commands, ru: Команды }
  works:
    en: "Command parser, a permission-filtered Java command tree, the commands packet and tab hints. {root_commands} vanilla commands, among them execute, gamemode, tp, summon, kill, data, time, fill, whitelist and ban."
    ru: "Парсер команд, дерево команд Java с учетом прав, пакет commands и подсказки по Tab. {root_commands} команд ванили, среди них execute, gamemode, tp, summon, kill, data, time, fill, whitelist и ban."
  missing:
    en: "The Bedrock command dialect is not implemented. The swing command has a specification but is not registered."
    ru: "Диалект команд Bedrock не реализован. У команды swing есть спецификация, но она не зарегистрирована."
  state: partial
  issues: [285, 667]
  evidence: "crates/mcrs_minecraft_server/tests/it/commands.rs; crates/mcrs_minecraft_server/tests/it/op_level.rs; crates/mcrs_minecraft_command_engine/src/command_tree.rs"
  verified: 2026-11-23

- id: entities
  title: { en: Entities and mobs, ru: Сущности и мобы }
  works:
    en: "Mobs are ECS entities with motion and attributes, plus a brain component where supported. Five mob types have data (pig, cow, sheep, chicken, zombified piglin); pigs, cows, sheep and chickens have panic, stroll and look-at-player AI. Item entities, falling blocks, attributes with modifiers and client replication work. A sorted hit queue applies health changes, armour and damage immunities."
    ru: "Мобы - ECS-сущности с компонентами движения и атрибутов, а при поддержке ИИ и с компонентом мозга. Есть данные пяти типов мобов (свинья, корова, овца, курица, зомби-свинолюд); у свиней, коров, овец и куриц есть ИИ паники, прогулки и взгляда на игрока. Работают предметы на земле, падающие блоки, атрибуты с модификаторами и репликация клиентам. Отсортированная очередь ударов применяет изменения здоровья, броню и иммунитеты к урону."
  missing:
    en: "Most other mobs and their AI. The 50,000-pig benchmark is marked provisional by its author, so we publish no numbers from it."
    ru: "Большинство остальных мобов и их ИИ. Бенчмарк на 50 000 свиней автор сам пометил как предварительный, поэтому его цифр мы не публикуем."
  state: partial
  issues: [102, 224, 103, 1067, 1074, 1076]
  evidence: "crates/mcrs_minecraft_server/tests/it/mob_ai.rs; crates/mcrs_minecraft_server/tests/it/mob_replication.rs; crates/mcrs_minecraft_engine_damage/tests/it/hit_order.rs"
  verified: 2026-11-23

- id: physics
  title: { en: Physics and movement, ru: Физика и движение }
  works:
    en: "Physics kernel with collisions and impulses, a movement check for players, comparison with recordings of the vanilla client. Results do not depend on the thread count. The client moves the local player with the same movement kernel, and a public kernel selects the pose of a player. Teleport confirmation follows its specification, and scripted-client tests check it."
    ru: "Ядро физики с коллизиями и импульсами, проверка движения игрока, сверка с записями ванильного клиента. Результат не зависит от числа потоков. Клиент двигает локального игрока тем же ядром движения, а позу игрока выбирает публичное ядро. Подтверждение телепорта работает по спецификации, его проверяют тесты со скриптовым клиентом."
  missing:
    en: "The teleport confirmation spec still has open questions about Bedrock clients."
    ru: "В спецификации подтверждения телепорта остались открытые вопросы про клиентов Bedrock."
  state: works
  issues: [85, 623]
  evidence: "cargo nextest run -p mcrs_minecraft_engine_physics -p mcrs_minecraft_server tick_determinism"
  verified: 2026-11-17

