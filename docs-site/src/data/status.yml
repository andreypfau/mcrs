- id: tools
  title: { en: Tools, ru: Инструменты }
  works:
    en: "One command moves the project to a new game snapshot. Also the vanilla oracle, mob bench, server bench, client recorder, Molang corpus, the xtask checks, and a probe that drives a server with scripted clients and compares mcrs with a vanilla trace."
    ru: "Одна команда переводит проект на новый снапшот игры. Еще oracle ванили, mob bench, server bench, client recorder, корпус Molang, проверки xtask и probe, который гоняет сервер скриптовыми клиентами и сравнивает mcrs с трассой ванили."
  missing:
    en: "Some tools need Java 21 or newer, and the mob bench needs Java 25."
    ru: "Часть инструментов требует Java 21 или новее, а mob bench требует Java 25."
  state: works
  issues: [507]
  evidence: "tools/mcrs_minecraft_update/README.md"
  verified: 2026-11-17

- id: library
  title: { en: Crates as a library, ru: Крейты как библиотека }
  works:
    en: "{crates} crates. CI checks that {crates_no_bevy} packages build without Bevy, {crates_no_std} without std and {crates_wasm32} for wasm32. Six library examples in examples/, each with a check of its dependency tree, among them a status ping and a player file viewer without Bevy and an inventory bot without a window."
    ru: "{crates} крейта. CI проверяет, что {crates_no_bevy} пакета собираются без Bevy, {crates_no_std} без std и {crates_wasm32} под wasm32. Шесть примеров библиотеки в examples/, у каждого проверяется дерево зависимостей, среди них status ping и просмотр файла игрока без Bevy и бот инвентаря без окна."
  missing:
    en: "Nothing is published on crates.io, the server, lobby and arena examples are not written, and the API is not stable."
    ru: "На crates.io ничего не опубликовано, примеров сервера, лобби и арены нет, API не стабилен."
  state: partial
  issues: [180, 287, 321]
  evidence: "xtask/src/checks.rs (portability job in CI)"
  verified: 2026-11-18
