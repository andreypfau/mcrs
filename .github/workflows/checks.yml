name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHECKS_BASE_REF: origin/${{ github.base_ref || 'main' }}
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

# A pull request from this repository runs on the self-hosted runner, whose build directory is
# always warm. A pull request from a fork never runs there: it runs on hosted runners from the
# build caches that each push to main saves. A push to main runs both.
jobs:
  # The same rule as the change scope of xtask: docs/, root Markdown and licences build nothing.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: decide whether the change touches anything but documentation
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "${PR}" ]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "${RUNNER_TEMP}/files"
            if [ -s "${RUNNER_TEMP}/files" ] && ! grep -qvE '^docs/|^[^/]+\.md$|^LICENSE-[^/]*$' "${RUNNER_TEMP}/files"; then
              code=false
            fi
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/rust

      - name: run the checks
        run: scripts/hooks/run-checks lint

  self-hosted:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, mcrs]
    timeout-minutes: 45
    steps:
      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/rust
        with:
          test-tools: true

      # The three triggers only read the worktree, and one build directory serves them all.
      - name: run clippy, the tests and the portability builds at once
        run: |
          cargo build --locked --quiet -p xtask --target-dir "${CARGO_TARGET_DIR:-target}/xtask"
          for trigger in clippy test portability; do
            "${CARGO_TARGET_DIR:-target}/xtask/debug/xtask" "${trigger}" > "${RUNNER_TEMP}/${trigger}.log" 2>&1 &
            echo "$!" > "${RUNNER_TEMP}/${trigger}.pid"
          done
          failed=
          for trigger in clippy test portability; do
            if wait "$(cat "${RUNNER_TEMP}/${trigger}.pid")"; then
              echo "::group::${trigger}: passed"
              cat "${RUNNER_TEMP}/${trigger}.log"
              echo "::endgroup::"
            else
              echo "::error::${trigger} failed"
              cat "${RUNNER_TEMP}/${trigger}.log"
              failed=1
            fi
          done
          test -z "${failed}"

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none

      - uses: ./.github/actions/rust

      - name: run clippy
        run: scripts/hooks/run-checks clippy

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/rust
        with:
          test-tools: true

      # A runner that runs out of memory is shut down with no message of its own: add swap, and
      # log memory each minute.
      - name: add swap
        run: |
          sudo fallocate -l 16G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -m

      - name: run the tests
        run: |
          (while sleep 60; do free -m | awk 'NR > 1'; done) &
          scripts/hooks/run-checks test

      # Tests download the jar when the restore misses; a save of a key that exists is a no-op.
      - name: save the client jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.minecraft/versions
          key: client-jars-${{ hashFiles('crates/mcrs_minecraft_client_jar/src/release.json') }}

  portability:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none

      - uses: ./.github/actions/rust

      - name: build without Bevy, for wasm32 and without std
        run: scripts/hooks/run-checks portability

  checks:
    name: checks
    needs: [changes, lint, self-hosted, clippy, test, portability]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: fail unless every check job that applies passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          OWN: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          FORK: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
          LINT: ${{ needs.lint.result }}
          SELF_HOSTED: ${{ needs.self-hosted.result }}
          HOSTED: ${{ needs.clippy.result }} ${{ needs.test.result }} ${{ needs.portability.result }}
        run: |
          if [ "${CODE}" = false ]; then exit 0; fi
          echo "lint ${LINT}; self-hosted ${SELF_HOSTED}; clippy, test, portability ${HOSTED}"
          test "${CODE}" = true
          test "${LINT}" = success
          if [ "${OWN}" = true ]; then test "${SELF_HOSTED}" = success; fi
          if [ "${FORK}" = true ]; then test "${HOSTED}" = "success success success"; fi
