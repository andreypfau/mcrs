name: docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - "crates/**"
      - "docs/**"
      - "tools/**"
      - "PERF.md"
      - "README.md"
      - "assets/minecraft/version.json"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: build the docs
        working-directory: docs-site
        run: |
          npm ci
          npm run build
      - name: warn about pages whose sources changed
        run: node docs-site/scripts/check-sources.mjs
        env:
          CHECK_SOURCES_BASE: origin/${{ github.base_ref }}
