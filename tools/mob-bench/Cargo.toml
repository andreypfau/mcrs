[package]
name = "mcrs_mob_bench"
description = "Runs the 50,000-pig scene on mcrs, vanilla or Horizon and measures ticks, CPU and pig motion"
version.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "mob-bench"
path = "src/main.rs"
doctest = false

[[bin]]
name = "mob-drift"
path = "drift/main.rs"
doctest = false

[lints]
workspace = true

# std: tokio, process, Mach and Win32 counters
[dependencies]
anyhow.workspace = true
glam.workspace = true
libc.workspace = true
mcrs_minecraft_bench_support.workspace = true
mcrs_minecraft_core.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_network.workspace = true
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_protocol_game.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
