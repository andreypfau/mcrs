[package]
name = "mcrs_mob_bench"
description = "Runs the 50,000-pig scene on mcrs, vanilla or Horizon and measures ticks, CPU and pig motion"
version.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "mob-bench"
path = "src/main.rs"
doctest = false
test = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
glam = { workspace = true, features = ["std"] }
libc.workspace = true
mcrs_minecraft_bench_support.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_network.workspace = true
mcrs_minecraft_protocol.workspace = true
mcrs_minecraft_protocol_game.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
