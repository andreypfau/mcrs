	jvmArgs '-Xmx2G'
	workingDir = temporaryDir
	args = ['--reports', '--output', project.findProperty('reportsOut') ?: "${layout.buildDirectory.get()}/reports-out".toString()]
}

tasks.register('dumpDefinitions', JavaExec) {
	group = 'oracle'
