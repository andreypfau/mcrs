plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def game = new groovy.json.JsonSlurper().parse(file('../../assets/minecraft/version.json'))

dependencies {
	minecraft "com.mojang:minecraft:${game.id}"
}

sourceSets {
	data {
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.compileClasspath + configurations.runtimeClasspath
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('dumpOracle', JavaExec) {
	group = 'oracle'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'mcrs.oracle.VanillaOracle'
	jvmArgs '-Xmx2G'
	args = [project.findProperty('oracleOut') ?: "${projectDir}/oracle-out".toString()]
}

tasks.register('dumpSurface', JavaExec) {
	group = 'oracle'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'mcrs.oracle.SurfaceOracle'
	jvmArgs '-Xmx2G', '-DMC_DEBUG_ENABLED', '-DMC_DEBUG_DISABLE_CARVERS'
	args = [project.findProperty('oracleOut') ?: "${projectDir}/oracle-out".toString()]
}

