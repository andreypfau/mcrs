nextest-version = "0.9.143"
experimental = ["setup-scripts"]

[scripts.setup.fetch-client-jar]
command = 'cargo run --quiet --locked -p mcrs_minecraft_client_jar --example fetch'
slow-timeout = { period = "60s", terminate-after = 5 }

# The default tier and jar:: tests run everywhere, pull requests included, except that CI
# skips every crate that depends on wgpu and everything above it; those run locally only.
# exhaustive:: and online:: tests run on the schedule, through the full profile.
# gpu:: tests run only on a machine with a Metal GPU, through the gpu profile.
# No test run may take longer than five minutes (global-timeout, inherited by every profile).
# vanilla_server:: runs only through tools/vanilla-server/run.sh, with the vanilla-server profile.
# cargo_shear:: tests run the real cargo-shear: the default profile skips them, the ci profile (the push
# and ci triggers, so every pull request and push to main) and the scheduled full run include them.
# cargo_mutants:: tests run the real cargo-mutants. No hook and no CI workflow runs them: only the
# mutants-tool profile does, by hand.
# The mutants profile is what cargo-mutants runs its tests with for every mutant; mutants-matrix runs the same
# tests but lists every failing one. Both inherit the default filter, so no test of the sets the default
# profile skips ever runs under mutation.
[profile.default]
default-filter = "not test(/(^|::)(exhaustive|gpu|online|vanilla_server|cargo_shear|cargo_mutants)::/)"
slow-timeout = { period = "15s", terminate-after = 4 }
global-timeout = "5m"

[[profile.default.scripts]]
filter = 'test(/(^|::)jar::/)'
setup = 'fetch-client-jar'

[profile.ci]
default-filter = "not test(/(^|::)(exhaustive|gpu|online|vanilla_server|cargo_mutants)::/)"
fail-fast = false

[[profile.ci.scripts]]
filter = 'test(/(^|::)jar::/)'
setup = 'fetch-client-jar'

[profile.full]
default-filter = "not test(/(^|::)(gpu|vanilla_server|cargo_mutants)::/)"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.full.scripts]]
filter = 'test(/(^|::)jar::/)'
setup = 'fetch-client-jar'

[profile.gpu]
default-filter = "test(/(^|::)gpu::/)"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.vanilla-server]
default-filter = "test(/(^|::)vanilla_server::/)"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.mutants-tool]
default-filter = "test(/(^|::)cargo_mutants::/)"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.mutants]
fail-fast = true
retries = 0
slow-timeout = { period = "15s", terminate-after = 4 }

[[profile.mutants.scripts]]
filter = 'test(/(^|::)jar::/)'
setup = 'fetch-client-jar'

[profile.mutants-matrix]
fail-fast = false
retries = 0
slow-timeout = { period = "15s", terminate-after = 4 }
status-level = "fail"
final-status-level = "fail"
failure-output = "never"

[[profile.mutants-matrix.scripts]]
filter = 'test(/(^|::)jar::/)'
setup = 'fetch-client-jar'
