nextest-version = "0.9.143"
experimental = ["setup-scripts"]

[scripts.setup.fetch-client-jar]
command = 'cargo run --quiet --locked -p mcrs_minecraft_client_jar --example fetch'
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.default]
default-filter = "not test(/(^|::)(exhaustive|gpu|online|vanilla_server)::/)"
slow-timeout = { period = "15s", terminate-after = 4 }
global-timeout = "5m"

[[profile.default.scripts]]
filter = 'all()'
setup = 'fetch-client-jar'

[profile.ci]
default-filter = "not test(/(^|::)(exhaustive|gpu|online|vanilla_server)::/)"
fail-fast = false

[[profile.ci.scripts]]
filter = 'all()'
setup = 'fetch-client-jar'

[profile.ci-hosted]
default-filter = "not test(/(^|::)(exhaustive|gpu|online|vanilla_server)::/)"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
global-timeout = "30m"

[[profile.ci-hosted.scripts]]
filter = 'all()'
setup = 'fetch-client-jar'

[profile.full]
default-filter = "not test(/(^|::)(gpu|vanilla_server)::/)"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.full.scripts]]
filter = 'all()'
setup = 'fetch-client-jar'

[profile.gpu]
default-filter = "test(/(^|::)gpu::/)"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.gpu.scripts]]
filter = 'all()'
setup = 'fetch-client-jar'

[profile.vanilla-server]
default-filter = "test(/(^|::)vanilla_server::/)"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.vanilla-server.scripts]]
filter = 'all()'
setup = 'fetch-client-jar'
