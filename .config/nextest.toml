nextest-version = "0.9.143"

[profile.default]
default-filter = "not test(/(^|::)(exhaustive|gpu|online|vanilla_server)::/)"
slow-timeout = { period = "15s", terminate-after = 4 }

[profile.ci]
fail-fast = false

[profile.full]
default-filter = "not test(/(^|::)(gpu|vanilla_server)::/)"
slow-timeout = { period = "60s" }

[profile.gpu]
default-filter = "test(/(^|::)gpu::/)"
slow-timeout = { period = "60s", terminate-after = 5 }
