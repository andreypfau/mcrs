[build]
rustc-workspace-wrapper = "scripts/rustc-wrapper"

[env]
BEVY_ASSET_ROOT = { value = ".", relative = true }
MCRS_LINT_TICK_SCHEDULES = "TickDimensions,OutboundFlush"

[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '--cfg', 'web_sys_unstable_apis', '-Zcodegen-backend=llvm']

[target.wasm32v1-none]
rustflags = ['-Zcodegen-backend=llvm']

[target.aarch64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=4", "-Zcache-proc-macros"]

[unstable]
codegen-backend = true
embed-metadata = false
fine-grain-locking = true
checksum-freshness = true
mtime-on-use = true
feature-unification = true

[resolver]
feature-unification = "workspace"

[alias]
xtask = "run --quiet --locked -p xtask --target-dir target/xtask --"
