reviews:
  high_level_summary_in_walkthrough: true
  # The workflow review.yml asks for a review once the checks of a commit pass.
  auto_review:
    enabled: false
  path_filters:
    - "!crates/*/src/*_keys.rs"
    - "!crates/mcrs_minecraft_keys/src/**"
    - "!crates/mcrs_minecraft_registry_catalog/src/**"
