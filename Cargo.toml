#cargo-features = ["codegen-backend"]

[package]
name = "mcrs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mcrs"
path = "src/main.rs"

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
fixedbitset = "0.5.7"
bevy_ecs = { version = "0.19.1", features = ["trace"] }
bevy_ecs_macros = "0.19.1"
bevy_app = { version = "0.19.1" }
bevy_math = "0.19.1"
bevy_time = "0.19.1"
bevy_tasks = "0.19.1"
bevy_utils = { version = "0.19.1", features = ["debug"] }
# `file_watcher` cannot compile for wasm; the client re-enables it through
# `bevy` for non-wasm targets, so a native build still hot-reloads.
bevy_asset = { version = "0.19.1" }
bevy_derive = "0.19.1"
bevy_log = { version = "0.19.1" }
bevy_reflect = "0.19.1"
bevy_platform = "0.19.1"
bevy_state = "0.19.1"

rocksdb = { version = "0.24.0" }
heck = "0.5.0"
cipher = "0.5.0-rc.2"
async-compression = { version = "0.4.36", features = ["tokio", "zlib"] }
proc-macro2 = "1.0.103"
syn = "2.0.110"
quote = "1.0.42"
bytes = "1"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145"}
aes = "0.9.0-rc.2"
base64 = "0.22.1"
bitfield-struct = "0.12.1"
byteorder = "1.5.0"
crc32c = "0.6.8"
cfb8 = "0.9.0-rc.1"
derive_more = "2.0.1"
flate2 = "1.1.5"
thiserror = "2.0.17"
tracing = "0.1.41"
url = { version = "2.5.7", features = ["serde"] }
uuid = "1.18.1"
rand = "0.10.0-rc.5"
indexmap = "2.12.0"
rustc-hash = "2.1.1"
arrayvec = "0.7.6"
smallvec = "1.13"
num-integer = "0.1.46"
num-traits = "0.2.19"
tokio = {  version = "1.48.0", features = ["full"] }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
md-5 = "0.11.0-rc.3"
sha2 = "0.11.0"
rand_xoshiro = "0.8.0-rc.0"
flume = { version = "0.12.0", default-features = false }
rayon = "1"

mcrs_minecraft_protocol_macros = { path = "crates/mcrs_minecraft_protocol_macros" }
mcrs_minecraft_protocol = { path = "crates/mcrs_minecraft_protocol", default-features = false, features = ["compression"] }
mcrs_minecraft_nbt = { path = "crates/mcrs_minecraft_nbt" }
mcrs_minecraft_network = { path = "crates/mcrs_minecraft_network", default-features = false }
mcrs_minecraft_level = { path = "crates/mcrs_minecraft_level" }
mcrs_minecraft_core_macros = { path = "crates/mcrs_minecraft_core_macros" }
mcrs_minecraft_core = { path = "crates/mcrs_minecraft_core", default-features = false }
mcrs_minecraft_registry = { path = "crates/mcrs_minecraft_registry", default-features = false }
mcrs_minecraft_profile = { path = "crates/mcrs_minecraft_profile" }
mcrs_minecraft_text = { path = "crates/mcrs_minecraft_text" }
mcrs_minecraft_assets = { path = "crates/mcrs_minecraft_assets" }
mcrs_minecraft_world = { path = "crates/mcrs_minecraft_world" }
mcrs_minecraft_environment = { path = "crates/mcrs_minecraft_environment" }
mcrs_minecraft_block = { path = "crates/mcrs_minecraft_block" }
mcrs_minecraft_biome = { path = "crates/mcrs_minecraft_biome" }
mcrs_minecraft_dimension = { path = "crates/mcrs_minecraft_dimension" }
mcrs_minecraft_item = { path = "crates/mcrs_minecraft_item" }
mcrs_minecraft_server = { path = "crates/mcrs_minecraft_server" }
mcrs_minecraft_client = { path = "crates/mcrs_minecraft_client", default-features = false }
mcrs_minecraft_mesh = { path = "crates/mcrs_minecraft_mesh" }
mcrs_minecraft_worldgen = { path = "crates/mcrs_minecraft_worldgen", default-features = false }
mcrs_minecraft_worldgen_testing = { path = "crates/mcrs_minecraft_worldgen_testing" }
mcrs_minecraft_worldgen_noise = { path = "crates/mcrs_minecraft_worldgen_noise", default-features = false }
mcrs_minecraft_worldgen_density = { path = "crates/mcrs_minecraft_worldgen_density", default-features = false }
mcrs_minecraft_worldgen_surface = { path = "crates/mcrs_minecraft_worldgen_surface", default-features = false }
mcrs_minecraft_worldgen_feature = { path = "crates/mcrs_minecraft_worldgen_feature", default-features = false }
mcrs_minecraft_worldgen_feature_place = { path = "crates/mcrs_minecraft_worldgen_feature_place", default-features = false }
mcrs_minecraft_worldgen_generator = { path = "crates/mcrs_minecraft_worldgen_generator" }
mcrs_minecraft_worldgen_carver = { path = "crates/mcrs_minecraft_worldgen_carver", default-features = false }
mcrs_minecraft_worldgen_structure = { path = "crates/mcrs_minecraft_worldgen_structure" }
mcrs_minecraft_worldgen_structure_place = { path = "crates/mcrs_minecraft_worldgen_structure_place" }
mcrs_minecraft_random = { path = "crates/mcrs_minecraft_random" }
mcrs_minecraft_light = { path = "crates/mcrs_minecraft_light", default-features = false }
mcrs_telemetry = { path = "crates/mcrs_telemetry" }
mcrs_minecraft_anvil = { path = "crates/mcrs_minecraft_anvil" }
mcrs_minecraft_chunk = { path = "crates/mcrs_minecraft_chunk", default-features = false }
wtransport = "0.7.2"

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_log.workspace = true
tokio = { version = "1", features = ["full"] }
mcrs_minecraft_server.workspace = true
mcrs_minecraft_network = { workspace = true, features = ["bevy"] }
mcrs_telemetry.workspace = true

[dev-dependencies]
mcrs_minecraft_worldgen_generator.workspace = true
bevy_state.workspace = true
mcrs_minecraft_client.workspace = true
mcrs_minecraft_assets.workspace = true
mcrs_minecraft_core = { workspace = true, features = ["bevy"] }
mcrs_minecraft_world.workspace = true
mcrs_minecraft_worldgen = { workspace = true, features = ["bevy", "fast"] }

[features]
telemetry = ["telemetry-tracy", "telemetry-diagnostics"]
telemetry-tracy = ["mcrs_telemetry/telemetry-tracy", "mcrs_minecraft_server/telemetry-tracy"]
# Diagnostics features stay confined to mcrs_telemetry because no other
# crate currently registers diagnostic plugins. Add propagation lines
# here when individual crates start exposing their own histograms.
telemetry-diagnostics = ["mcrs_telemetry/telemetry-diagnostics"]

[profile.dev]
opt-level = 0
# Full debug info dominates compile and link time across a workspace this size.
# Line tables keep backtraces readable, which is all the tests need.
debug = "line-tables-only"
debug-assertions = true

[profile.dev.package."*"]
opt-level = 3

# Build scripts and proc macros run at compile time, so optimizing them buys
# build time rather than frame time. `package."*"` does not reach them.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# `package."*"` only covers external dependencies; workspace members inherit
# [profile.dev] opt-level 0. Both paths a column can arrive by are far too hot
# for that: generation (density-function evaluation, octave Perlin noise,
# palette writes) and the read out of the save (zlib, NBT, palette unpacking),
# so the member crates on either are optimized even in dev builds.
[profile.dev.package."mcrs_minecraft_worldgen"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_anvil"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_nbt"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_protocol"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_worldgen_noise"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_worldgen_density"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_worldgen_surface"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_worldgen_feature"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_worldgen_feature_place"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_worldgen_generator"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_worldgen_carver"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_worldgen_structure"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_worldgen_structure_place"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_random"]
opt-level = 3

# The light engine runs a frontier relaxation over millions of cells every time
# a column arrives, so it belongs with the other per-column hot paths.
[profile.dev.package."mcrs_minecraft_light"]
opt-level = 3

[profile.dev.package."mcrs_minecraft_server"]
opt-level = 2

[profile.dev.package."mcrs_minecraft_level"]
opt-level = 2

# The browser bundle is inlined into a single HTML file, so binary size is the
# dominant cost there in a way it never is for a native build.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
